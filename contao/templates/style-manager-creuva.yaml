      cssClass: 'w50'
      blankOption: true
      extendContentElement: true
      contentElements: *allElements
      extendArticle: true
      extendModule: true
      sorting: 100
      cssClasses:
        u-reveal-up: 'Von unten'
        u-reveal-left: 'Von links'
        u-reveal-right: 'Von rechts'
        u-reveal-down: 'Von oben'
        u-reveal-zoom: 'Zoom'
        u-reveal-blur: 'Unschärfe'
        u-reveal-fade: 'Nur Einblenden'
        u-reveal-none: 'Keine Animation'
    stagger:
      title: 'Inhalte nacheinander'
      description: 'Die Elemente erscheinen kurz nacheinander (Raster-Gruppen machen das automatisch)'
