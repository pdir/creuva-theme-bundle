        u-button-secondary: 'Sekundär-Button'

creuvaSpacing:
  title: 'Abstände'
  desc: 'Zusätzlicher Abstand innen (oben/unten) und nach oben'
  groupAlias: 'Creuva'
  sorting: 500
  children:
    padding:
      title: 'Innenabstand oben/unten'
      cssClass: 'w50'
      blankOption: true
      extendContentElement: true
      contentElements: &allElements [text, headline, hyperlink, image, gallery, list, table, description_list, accordion, element_group, download, downloads, code, markdown, html, unfiltered_html, youtube, vimeo, player, swiper, teaser, template, creuva_hero, ct_contentBox, ct_featureElement, ct_priceBox, ct_sliderElement, ct_teaserBox, feature_section, module, form, alias, article]
