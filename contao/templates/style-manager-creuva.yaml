# Style Manager configuration of the Creuva theme
# (oveleon/contao-component-style-manager, loaded automatically as bundle
# configuration, nothing to import). Editors select the classes in the style
# section of content elements, articles and modules; they are written into
# the CSS class field.
#
# Archive and group aliases are part of the stored selection
# (<archive>_<group>), do not rename them. The demo import uses this file to
# preselect the classes of the demo elements (src/Installer/StyleManagerValues.php).
#
# contentElements is required for content elements: a group without the list
# is not shown at all. Every top-level key is an archive, so the shared lists
# are defined as YAML anchors at their first use.

creuvaSection:
  title: 'Abschnitt & Hintergrund'
  desc: 'Hintergrundfläche, Breite und Rahmen des Elements'
  groupAlias: 'Creuva'
  sorting: 100
  children:
    background:
      title: 'Hintergrund'
      description: 'Fläche mit Innenabstand und runden Ecken; „Primär“ ist die dunkle Fläche für Call-to-Action-Boxen'
      cssClass: 'w50'
      blankOption: true
      extendContentElement: true
      contentElements: &sectionElements [text, headline, list, table, description_list, accordion, element_group, downloads, gallery, ct_contentBox, ct_featureElement, ct_priceBox, ct_teaserBox, module, form]
      extendArticle: true
      sorting: 100
      cssClasses:
        u-bg-surface: 'Weiß'
        u-bg-muted: 'Hellgrau'
        u-bg-accent: 'Akzent hell'
        u-bg-primary: 'Primär (dunkel)'
    width:
      title: 'Breite'
      description: 'Volle Breite zieht den Hintergrund bis an den Fensterrand'
      cssClass: 'w50'
      blankOption: true
      extendContentElement: true
      contentElements: *sectionElements
      sorting: 200
      cssClasses:
        u-full-bleed: 'Volle Breite (Hintergrund)'
        u-narrow: 'Schmal (Lesebreite)'
    frame:
      title: 'Rahmen'
      description: 'Karte mit Rahmen und Schatten, hervorgehoben z. B. für das empfohlene Preispaket'
      cssClass: 'w50 clr'
      blankOption: true
      extendContentElement: true
      contentElements: *sectionElements
      sorting: 300
      cssClasses:
        u-card: 'Karte'
        u-featured: 'Hervorgehoben (Preis-Karte)'

creuvaGrid:
  title: 'Raster'
  desc: 'Spalten für die Elemente einer Elementgruppe (auf Smartphones untereinander)'
  groupAlias: 'Creuva'
  sorting: 200
  children:
    columns:
      title: 'Spalten'
      cssClass: 'w50'
      blankOption: true
      extendContentElement: true
      contentElements: [element_group]
      sorting: 100
      cssClasses:
        u-grid-2: '2 Spalten'
        u-grid-3: '3 Spalten'
        u-grid-4: '4 Spalten'
    align:
      title: 'Vertikale Ausrichtung'
      description: '„Unten“ für Abschnittsköpfe aus Überschrift und Einleitung'
      cssClass: 'w50'
      blankOption: true
      extendContentElement: true
      contentElements: [element_group]
      sorting: 200
      cssClasses:
        u-align-center: 'Mittig'
        u-align-end: 'Unten (Abschnittskopf)'

creuvaText:
  title: 'Text'
  desc: 'Ausrichtung und Textstil'
  groupAlias: 'Creuva'
  sorting: 300
  children:
    align:
      title: 'Ausrichtung'
      cssClass: 'w50'
      blankOption: true
      extendContentElement: true
      contentElements: &textElements [text, headline, hyperlink, list, description_list, element_group, markdown, ct_contentBox, ct_teaserBox]
      sorting: 100
      cssClasses:
        u-text-left: 'Links'
        u-text-center: 'Zentriert'
        u-text-right: 'Rechts'
