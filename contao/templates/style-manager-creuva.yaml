        u-muted: 'Gedämpft'
        u-accent: 'Akzentfarbe'
        u-kicker: 'Dachzeile'

creuvaButton:
  title: 'Buttons'
  desc: 'Hyperlink-Element als Button; im Text-Element werden die Links im letzten Absatz zu Buttons'
  groupAlias: 'Creuva'
  sorting: 400
