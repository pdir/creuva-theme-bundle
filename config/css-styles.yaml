      title: 'Akkordeon-Icon'
      contentElements: [accordion]
      sorting: 100
      styles:
        u-accordion-icon: 'Fragezeichen'
        u-accordion-info: 'Info'
        u-accordion-chat: 'Sprechblase'
    media:
      title: 'Bild & Text'
      description: 'Nur für die Templatevariante „Bild & Text“'
      contentElements: [text]
      sorting: 200
      styles:
        u-media-plain: 'Ohne Akzentfläche hinter dem Bild'
    feature:
      title: 'Icon-Box'
      description: 'Nur für die Templatevariante „Icon-Box“'
      contentElements: [text]
      sorting: 300
      styles:
        u-feature-plain: 'Ohne Karte'
        u-feature-inline: 'Icon links, ohne Karte'
    gallery:
      title: 'Galerie-Anordnung'
      description: 'Ohne Auswahl: Raster mit „Bilder pro Reihe“ (1–6 Spalten). Mosaik: großes Bild mit einem breiten und zwei kleinen daneben (je vier Bilder). Masonry: Bilder in eigener Höhe, dafür eine Bildgröße ohne Zuschnitt wählen.'
      contentElements: [gallery]
      sorting: 320
      styles:
        u-gallery-mosaic: 'Mosaik, großes Bild links'
        u-gallery-mosaic-right: 'Mosaik, großes Bild rechts'
        u-gallery-featured: 'Erstes Bild groß, Rest darunter'
        u-gallery-masonry: 'Masonry (Bilder in eigener Höhe)'
    cta:
      title: 'Call to Action'
      description: 'Nur für die Templatevariante „Call to Action“; Farbe unter „Farben des Elements“, volle Breite unter „Abschnitt & Hintergrund › Breite“'
      contentElements: [text]
      sorting: 350
      styles:
        u-cta-stacked: 'Zentriert, Buttons unter dem Text'
    table:
      title: 'Tabelle'
      description: 'Spalten 2–4 farbig wie Pakete, „✓“ und „–“ als Icons; erste Zeile als Kopfzeile'
      contentElements: [table]
      sorting: 400
      styles:
