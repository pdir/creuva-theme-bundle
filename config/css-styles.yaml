# CSS styles of the Creuva theme (pdir/css-style-selector-bundle).
# Every section becomes a style category (tl_css_style_category), every entry
# below "groups" a style group with single selection in this category
# (tl_css_style_group) and every class below "styles" a style of this group
# (tl_css_style_selector). They are imported by creuva:install, the migration
# CssStyleImportMigration and the command creuva:css-styles, so editors can
# change them and add their own categories and groups in the back end
# (Layout › CSS styles). The import only adds missing categories, groups and
# styles, it never changes or removes existing ones.
#
# Editors select the styles in the "CSS style" section of content elements,
# articles and modules; the classes are written into the CSS class field.
#
# Section and group keys identify the imported categories (<section>) and
# groups (<section>.<group>), do not rename them. The demo import preselects the styles of the demo elements
# by their classes (src/Installer/CssStyleValues.php).
#
# Content elements: the styles are only offered for the types in
# contentElements. Articles and modules: "article: true" and "module: true".
# The description of a section is shown below the category title. The shared
# element lists are defined as YAML anchors at their first use.

creuvaSection:
  title: 'Abschnitt & Hintergrund'
  description: 'Hintergrundfläche, Breite und Rahmen des Elements'
  sorting: 100
  groups:
    background:
      title: 'Hintergrund'
      description: 'Fläche mit Innenabstand und runden Ecken; „Primär“ ist die dunkle Fläche für Call-to-Action-Boxen'
      contentElements: &sectionElements [text, headline, list, table, description_list, accordion, element_group, downloads, gallery, ct_contentBox, ct_featureElement, ct_priceBox, ct_teaserBox, module, form]
      article: true
      sorting: 100
      styles:
        u-bg-surface: 'Weiß'
        u-bg-muted: 'Hellgrau'
        u-bg-accent: 'Akzent hell'
        u-bg-primary: 'Primär (dunkel)'
    width:
      title: 'Breite'
      description: 'Volle Breite zieht den Hintergrund bis an den Fensterrand'
      contentElements: *sectionElements
      sorting: 200
      styles:
        u-full-bleed: 'Volle Breite (Hintergrund)'
        u-narrow: 'Schmal (Lesebreite)'
    frame:
      title: 'Rahmen'
      description: 'Karte mit Rahmen und Schatten, hervorgehoben z. B. für das empfohlene Preispaket'
      contentElements: *sectionElements
      sorting: 300
      styles:
        u-card: 'Karte'
        u-featured: 'Hervorgehoben (Preis-Karte)'

creuvaGrid:
  title: 'Raster'
  description: 'Spalten für die Elemente einer Elementgruppe (auf Smartphones untereinander)'
  sorting: 200
  groups:
    columns:
      title: 'Spalten'
      contentElements: [element_group]
      sorting: 100
      styles:
        u-grid-2: '2 Spalten'
        u-grid-3: '3 Spalten'
        u-grid-4: '4 Spalten'
    align:
      title: 'Vertikale Ausrichtung'
      description: '„Unten“ für Abschnittsköpfe aus Überschrift und Einleitung'
      contentElements: [element_group]
      sorting: 200
      styles:
        u-align-center: 'Mittig'
        u-align-end: 'Unten (Abschnittskopf)'
        u-align-start: 'Oben (Spalten nicht strecken)'
    widths:
      title: 'Spaltenbreite (2 Spalten)'
      description: 'Ab Tablet-Breite ist eine Spalte breiter (3 : 2), z. B. Tabelle mit Liste daneben'
      contentElements: [element_group]
      sorting: 300
      styles:
        u-cols-wide-start: 'Erste Spalte breiter'
        u-cols-wide-end: 'Zweite Spalte breiter'
    offset:
      title: 'Versatz'
      description: 'Ab Tablet-Breite steht die zweite (bei 3 Spalten die mittlere) Spalte tiefer, z. B. für Bildkacheln'
      contentElements: [element_group]
      sorting: 400
      styles:
        u-grid-offset: 'Versetzt (Spalte tiefer)'

creuvaText:
  title: 'Text'
  description: 'Ausrichtung und Textstil'
  sorting: 300
  groups:
    align:
      title: 'Ausrichtung'
      contentElements: &textElements [text, headline, hyperlink, list, description_list, element_group, markdown, ct_contentBox, ct_teaserBox]
      sorting: 100
      styles:
        u-text-left: 'Links'
        u-text-center: 'Zentriert'
        u-text-right: 'Rechts'
    style:
      title: 'Textstil'
      contentElements: *textElements
      sorting: 200
      styles:
        u-lead: 'Einleitung (größer)'
        u-muted: 'Gedämpft'
        u-accent: 'Akzentfarbe'
        u-kicker: 'Dachzeile'

creuvaColors:
  title: 'Farben des Elements'
  description: 'Für Karten, Icon-Boxen, Kundenstimmen, Preis-Karten, Call-to-Action-Boxen und die Boxen des Theme Components Bundles'
  sorting: 350
  groups:
    card:
      title: 'Hintergrund / Rahmen'
      description: 'Fläche in Weiß, Grau, Haupt- oder Akzentfarbe oder nur ein farbiger Rahmen'
      contentElements: &cardElements [text, ct_contentBox, ct_teaserBox, ct_priceBox, ct_featureElement]
      sorting: 100
      styles:
        u-card-white: 'Weiß'
        u-card-muted: 'Grau'
        u-card-soft: 'Akzent hell'
        u-card-primary: 'Hauptfarbe'
        u-card-accent: 'Akzentfarbe'
        u-card-outline-primary: 'Rahmen in Hauptfarbe'
        u-card-outline-accent: 'Rahmen in Akzentfarbe'
        u-card-flat: 'Ohne Rahmen und Schatten'
    icon:
      title: 'Icon'
      description: 'Kreis hinter dem Icon der Icon-Box bzw. der Kennzahlen: hell, mittel (Akzentfarbe) oder dunkel (Hauptfarbe); bei mittel und dunkel wird das Icon weiß (einfarbige SVG-Icons)'
      contentElements: [text, description_list]
      sorting: 200
      styles:
        u-icon-soft: 'Hell (Akzent hell, Icon farbig)'
        u-icon-accent: 'Mittel (Akzentfarbe, Icon weiß)'
        u-icon-primary: 'Dunkel (Hauptfarbe, Icon weiß)'
        u-icon-white: 'Weißer Kreis'
        u-icon-plain: 'Ohne Kreis'

creuvaButton:
  title: 'Buttons'
  description: 'Hyperlink-Element als Button; im Text-Element werden die Links im letzten Absatz zu Buttons'
  sorting: 400
  groups:
    style:
      title: 'Darstellung'
      description: 'Ohne Auswahl: Textlink mit Pfeil'
      contentElements: [hyperlink, text]
      sorting: 100
      styles:
        u-button: 'Primär-Button'
        u-button-secondary: 'Sekundär-Button'
        u-button-accent: 'Akzent-Button'
        u-button-outline: 'Outline (Hauptfarbe)'
        u-button-outline-accent: 'Outline (Akzentfarbe)'

creuvaSpacing:
  title: 'Abstände'
  description: 'Innenabstand (innerhalb der Fläche) und Außenabstand (zu den Nachbarn) – oben und unten, nur oben oder nur unten. Artikel ohne Hintergrund haben untereinander automatisch einen Abschnittsabstand.'
  sorting: 500
  groups:
    padding:
      title: 'Innenabstand oben und unten'
      contentElements: &allElements [text, headline, hyperlink, image, gallery, list, table, description_list, accordion, element_group, download, downloads, code, markdown, html, unfiltered_html, youtube, vimeo, player, swiper, teaser, template, creuva_hero, creuva_logos, creuva_match, ct_contentBox, ct_featureElement, ct_priceBox, ct_sliderElement, ct_teaserBox, feature_section, module, form, alias, article]
      article: true
      module: true
      sorting: 100
      styles:
        u-py-0: 'Kein'
        u-py-s: 'S'
        u-py-m: 'M'
        u-py-l: 'L'
        u-py-xl: 'XL'
    paddingTop:
      title: 'Innenabstand nur oben'
      contentElements: *allElements
      article: true
      module: true
      sorting: 110
      styles:
        u-pt-0: 'Kein'
        u-pt-s: 'S'
        u-pt-m: 'M'
        u-pt-l: 'L'
        u-pt-xl: 'XL'
    paddingBottom:
      title: 'Innenabstand nur unten'
      contentElements: *allElements
      article: true
      module: true
      sorting: 120
      styles:
        u-pb-0: 'Kein'
        u-pb-s: 'S'
        u-pb-m: 'M'
        u-pb-l: 'L'
        u-pb-xl: 'XL'
    marginY:
      title: 'Außenabstand oben und unten'
      contentElements: *allElements
      article: true
      module: true
      sorting: 190
      styles:
        u-my-0: 'Kein'
        u-my-s: 'S'
        u-my-m: 'M'
        u-my-l: 'L'
        u-my-xl: 'XL'
    marginTop:
      title: 'Außenabstand nur oben'
      contentElements: *allElements
      article: true
      module: true
      sorting: 200
      styles:
        u-mt-0: 'Kein'
        u-mt-s: 'S'
        u-mt-m: 'M'
        u-mt-l: 'L'
        u-mt-xl: 'XL'
    marginBottom:
      title: 'Außenabstand nur unten'
      contentElements: *allElements
      article: true
      module: true
      sorting: 220
      styles:
        u-mb-0: 'Kein'
        u-mb-s: 'S'
        u-mb-m: 'M'
        u-mb-l: 'L'
        u-mb-xl: 'XL'

creuvaAnimation:
  title: 'Animation'
  description: 'Einblenden beim Scrollen. Was animiert wird, legt die Einstellung „Animationen“ im Seitenlayout fest.'
  sorting: 600
  groups:
    reveal:
      title: 'Einblenden beim Scrollen'
      description: 'Ohne Auswahl: automatische Animation (Einstellung im Seitenlayout)'
      contentElements: *allElements
      article: true
      module: true
      sorting: 100
      styles:
        u-reveal-up: 'Von unten'
        u-reveal-left: 'Von links'
        u-reveal-right: 'Von rechts'
        u-reveal-down: 'Von oben'
        u-reveal-zoom: 'Zoom'
        u-reveal-blur: 'Unschärfe'
        u-reveal-fade: 'Nur Einblenden'
        u-reveal-none: 'Keine Animation'
    stagger:
      title: 'Inhalte nacheinander'
      description: 'Die Elemente erscheinen kurz nacheinander (Raster-Gruppen machen das automatisch)'
      contentElements: [element_group, list, gallery]
      sorting: 200
      styles:
        u-reveal-stagger: 'Nacheinander einblenden'
    countUp:
      title: 'Kennzahlen'
      description: 'Zahlen der Templatevariante „Kennzahlen“ zählen beim Scrollen hoch'
      contentElements: [description_list]
      sorting: 300
      styles:
        u-no-countup: 'Nicht hochzählen'

creuvaElements:
  title: 'Elementoptionen'
  description: 'Optionen für einzelne Elementtypen'
  sorting: 700
  groups:
