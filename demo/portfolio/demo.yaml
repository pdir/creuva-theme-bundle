pages:
  - type: regular
    title: Start
    alias: index
    description: 'Studio Lichtung fotografiert Architektur, Räume und Produkte und gestaltet Ausstellungen und Bücher – mit Ruhe, Licht und Haltung.'
    articles:
      - title: Hero
        elements:
          - type: creuva_hero
            size: 'image_size:cover'
            headline: { unit: h1, value: 'Räume, Licht und' }
            text: '<p>Wir fotografieren Architektur, Interieurs und Produkte und gestalten Ausstellungen und Bücher – für Menschen, die Wert auf das Besondere legen.</p>'
            singleSRC: 'file:bilder/start.jpg'
            creuvaKicker: 'Fotografie · Architektur · Gestaltung'
            creuvaHeadlineAccent: Geschichten.
            creuvaBadge: |-
              Haus am Hang, Freiburg
              Foto: Studio Lichtung
            creuvaHeroMask: cover
            creuvaUrl1: '{{link_url::arbeiten|urlattr}}'
            creuvaLinkTitle1: 'Arbeiten ansehen'
            creuvaUrl2: '{{link_url::studio|urlattr}}'
            creuvaLinkTitle2: 'Das Studio'
      - title: Haltung
        elements:
          - type: element_group
            cssID: 'u-grid-2 u-cols-wide-end u-align-start'
            children:
              - { type: headline, headline: 'Bilder mit Haltung.', subline: 'Studio Lichtung', cssID: u-reveal-left }
              - type: text
                text: '<p>Gute Bilder entstehen nicht im Vorbeigehen. Wir nehmen uns Zeit für einen Ort, beobachten das Licht und suchen die eine Perspektive, die erzählt, was einen Raum besonders macht.</p><p>Seit 2011 arbeiten wir für Architekturbüros, Museen, Hotels und Manufakturen – und an eigenen Serien, wenn die Aufträge einmal ruhen.</p><p><a href="{{link_url::studio}}">Mehr über das Studio</a></p>'
                cssID: u-lead
      - title: 'Ausgewählte Arbeiten'
        teaserCssID: ['', '']
        cssID: u-pt-0
        elements:
          - type: element_group
            cssID: 'u-grid-2 u-align-end'
            children:
              - { type: headline, headline: Arbeiten., subline: Ausgewählte, headline_inline: '1' }
              - type: text
                text: '<p>Architektur, Ausstellungen, Produkte und freie Serien – eine Auswahl der letzten Jahre.</p><p><a href="{{link_url::arbeiten}}">Alle Arbeiten</a></p>'
                cssID: u-muted
          - type: element_group
            cssID: 'u-grid-2 u-grid-offset'
            children:
              - type: text
                addImage: true
                size: 'image_size:tile-portrait'
                headline: { unit: h3, value: 'Haus am Hang' }
                text: '<p>Wohnhaus von Bürger Architekten am Schönberg.</p><p><a href="{{link_url::haus-am-hang}}">Projekt ansehen</a></p>'
                singleSRC: 'file:bilder/projekte/haus-am-hang.jpg'
                customTpl: content_element/text/creuva_tile
                subline: Architektur
              - type: text
                addImage: true
                size: 'image_size:tile-portrait'
                headline: { unit: h3, value: 'Kunsthalle am Fluss' }
                text: '<p>Ausstellungsgestaltung und Dokumentation.</p><p><a href="{{link_url::kunsthalle}}">Projekt ansehen</a></p>'
                singleSRC: 'file:bilder/projekte/kunsthalle.jpg'
                customTpl: content_element/text/creuva_tile
                subline: Ausstellung
              - type: text
                addImage: true
                size: 'image_size:tile-portrait'
                headline: { unit: h3, value: 'Form & Ton' }
                text: '<p>Produktfotografie für eine Keramik-Manufaktur.</p><p><a href="{{link_url::form-und-ton}}">Projekt ansehen</a></p>'
                singleSRC: 'file:bilder/projekte/form-und-ton-vasen.jpg'
                customTpl: content_element/text/creuva_tile
                subline: Produkt
              - type: text
                addImage: true
                size: 'image_size:tile-portrait'
                headline: { unit: h3, value: 'Atlas der Stille' }
                text: '<p>Freie Landschaftsserie, erschienen als Buch.</p><p><a href="{{link_url::atlas-der-stille}}">Projekt ansehen</a></p>'
                singleSRC: 'file:bilder/projekte/atlas-nebel.jpg'
                customTpl: content_element/text/creuva_tile
                subline: 'Freie Arbeit'
      - title: Disziplinen
        teaserCssID: ['', '']
        cssID: u-bg-muted
        elements:
          - { type: headline, headline: 'Wofür man uns bucht.', subline: 'Drei Disziplinen, ein Blick', cssID: u-text-center }
          - type: element_group
            cssID: u-grid-3
            children:
              - type: text
                addImage: true
                headline: { unit: h3, value: Fotografie }
                text: '<p>Architektur, Interieurs und Produkte – ruhig komponiert, natürlich belichtet, sorgfältig bearbeitet.</p><p><a href="{{link_url::leistungen}}">Mehr erfahren</a></p>'
                singleSRC: 'file:icons/kamera.svg'
                customTpl: content_element/text/creuva_feature
                cssID: 'u-feature-plain u-icon-white'
              - type: text
                addImage: true
                headline: { unit: h3, value: 'Ausstellung & Raum' }
                text: '<p>Wir gestalten Ausstellungen, Leitsysteme und Messeauftritte – vom ersten Grundriss bis zur Hängung.</p><p><a href="{{link_url::leistungen}}">Mehr erfahren</a></p>'
                singleSRC: 'file:icons/grundriss.svg'
                customTpl: content_element/text/creuva_feature
                cssID: 'u-feature-plain u-icon-white'
              - type: text
