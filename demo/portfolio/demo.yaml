forms:
  kontakt:
    title: Projektanfrage
    alias: projektanfrage
    jumpTo: 'page:danke'
    fields:
      - { type: text, name: name, mandatory: true, label: 'Ihr Name', placeholder: 'Vor- und Nachname', autocomplete: name }
      - { type: text, name: email, mandatory: true, label: E-Mail-Adresse, rgxp: email, placeholder: name@beispiel.de, autocomplete: email }
      - type: select
        name: topic
        label: 'Worum geht es?'
        options:
          - { value: architektur, label: Architekturfotografie }
          - { value: produkt, label: 'Produkt- und Stilllebenfotografie' }
          - { value: ausstellung, label: Ausstellungsgestaltung }
          - { value: buch, label: 'Buch und Editorial' }
          - { value: sonstiges, label: Sonstiges }
      - { type: text, name: date, label: 'Wunschtermin oder Zeitraum', placeholder: 'z. B. Frühjahr 2027' }
      - { type: textarea, name: message, mandatory: true, label: 'Ihr Projekt', size: ['6', '40'] }
      - type: checkbox
        name: privacy
        mandatory: true
        options: [{ value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }]
      - { type: submit, slabel: 'Anfrage senden' }
news:
  journal:
    title: Journal
    jumpTo: 'page:eintrag'
    items:
      - alias: licht-lesen-blaue-stunde
        headline: 'Licht lesen: Architektur zur blauen Stunde'
        subheadline: 'Warum wir Häuser am liebsten fotografieren, wenn der Tag geht'
        teaser: '<p>Für wenige Minuten sind Himmel und Innenraum gleich hell. Wir zeigen, wie wir diese Zeit planen und warum sie Architektur so gut steht.</p>'
        singleSRC: 'file:bilder/projekte/haus-am-hang-abend.jpg'
        creuvaHeadlineAccent: 'blauen Stunde'
        date: '2026-10-08 09:00'
        elements:
          - type: text
            text: '<p>Wenn die Sonne untergegangen ist, bleibt am Himmel ein tiefes, gleichmäßiges Blau. Gleichzeitig leuchten die Räume von innen. Für etwa zwanzig Minuten sind beide gleich hell – Fassade, Fenster und Landschaft lassen sich dann in einer Aufnahme zeigen, ohne dass etwas ausbrennt oder absäuft.</p><p>Diese Minuten planen wir genau: Wir prüfen vorab den Sonnenstand, stellen das Licht in allen Räumen ein und bauen die Kamera rechtzeitig auf. Meist entstehen an einem Abend nur zwei oder drei Motive – dafür die wichtigsten.</p>'
          - type: gallery
            size: 'image_size:media'
            fullsize: true
            multiSRC: ['file:bilder/projekte/haus-am-hang-abend.jpg', 'file:bilder/projekte/lindenhof-abend.jpg']
            sortBy: custom
            perRow: 2
          - type: text
            headline: { unit: h2, value: 'Drei Dinge, die wir immer mitnehmen' }
            text: '<ul><li>Ein stabiles Stativ und einen Fernauslöser</li><li>Eine Liste aller Lichtschalter im Haus</li><li>Geduld – und eine Thermoskanne Tee</li></ul>'
      - alias: atlas-der-stille-buch
        headline: '„Atlas der Stille“ erscheint als Buch'
        subheadline: '96 Seiten, 48 Landschaften, ein Jahr unterwegs'
        teaser: '<p>Unsere freie Serie über leise Landschaften erscheint im Verlag Weitsicht. Die Vorstellung findet am 14. November in Freiburg statt.</p>'
        singleSRC: 'file:bilder/projekte/atlas-nebel.jpg'
        creuvaHeadlineAccent: 'als Buch'
        date: '2026-09-22 10:00'
        elements:
          - type: text
            text: '<p>Ein Jahr lang sind wir an Orte gefahren, an denen es still ist: an Seen im ersten Licht, auf Dünen in der Dämmerung, in Wälder voller Nebel. Daraus ist „Atlas der Stille“ entstanden – ein Buch über Landschaften, die keine Sensation brauchen.</p><blockquote><p>„Stille ist kein leerer Raum. Sie ist der Raum, in dem man genauer hinsieht.“</p></blockquote><p>Das Buch erscheint im Verlag Weitsicht, gedruckt auf ungestrichenem Papier in einer Auflage von 800 Exemplaren.</p>'
      - alias: produktfotos-form-und-ton
        headline: 'Hinter den Kulissen: Keramik im Seitenlicht'
        subheadline: 'Wie die neuen Produktbilder für Form & Ton entstanden'
        teaser: '<p>Ein Fenster, ein Tisch, eine Wand in Sandfarbe: Für die Keramik-Manufaktur Form & Ton haben wir bewusst auf ein großes Studio verzichtet.</p>'
        singleSRC: 'file:bilder/projekte/form-und-ton-atelier.jpg'
        creuvaHeadlineAccent: 'Seitenlicht'
        date: '2026-08-30 08:30'
        elements:
          - type: text
            text: '<p>Keramik lebt von ihrer Oberfläche: von feinen Rillen, matter Glasur und kleinen Unregelmäßigkeiten. Hartes Studiolicht macht das flach. Deshalb haben wir in der Werkstatt der Manufaktur fotografiert – mit dem Licht eines großen Nordfensters und einer einzigen Aufhellung.</p><p>Die Hintergründe sind in den Farben der Glasuren gestrichen, so wirken alle Bilder der Kollektion wie aus einem Guss.</p>'
          - type: image
            size: 'image_size:wide'
            singleSRC: 'file:bilder/projekte/form-und-ton.jpg'
