# Creuva – Standard / Creative demo
#
# Imported with: vendor/bin/contao-console creuva:install --demo
# See src/Installer/DemoImporter.php for the value syntax (file:, page:, module:, image_size:, …).

title: Standard / Creative

# Also install the styleguide of the theme (styleguide/styleguide.yaml, page alias "styleguide")
styleguide: true

# Settings of the website root
root:
  dateFormat: d.m.Y
  datimFormat: d.m.Y
  timeFormat: H:i
  favicon: file:design/favicon.ico   # served as /favicon.ico (source: assets/favicon/favicon.svg)

# Metadata of the demo files (alternative texts, titles of downloads)
files:
  bilder/hero.jpg: { alt: Illustration einer Website auf Laptop und Smartphone }
  bilder/about.jpg: { alt: Illustration mit Kennzahlen der Agentur }
  bilder/detail-1.jpg: { alt: Drei Smartphone-Ansichten einer Website }
  bilder/detail-2.jpg: { alt: Website-Entwurf im Browserfenster }
  bilder/detail-3.jpg: { alt: Farbpalette und Typografie eines Designsystems }
  bilder/projekt-gruenwerk.jpg: { alt: Website von Grünwerk Energie }
  bilder/projekt-nordlicht.jpg: { alt: Website von Nordlicht Studio }
  bilder/projekt-alpenhof.jpg: { alt: Website von Hotel Alpenhof }
  bilder/projekt-stadtwerke.jpg: { alt: Serviceportal der Stadtwerke Elbtal }
  bilder/projekt-roesterei.jpg: { alt: Mobile Shop-Ansichten der Kaffeerösterei Bohne }
  bilder/projekt-sportverein.jpg: { alt: Website des SV Grün-Weiß }
  bilder/team-1.jpg: { alt: Porträt Tobias Krüger }
  bilder/team-2.jpg: { alt: Porträt Mira Schulz }
  bilder/team-3.jpg: { alt: Porträt Daniel Owusu }
  bilder/team-4.jpg: { alt: Porträt Lena Hoffmann }
  bilder/team-5.jpg: { alt: Porträt Jonas Weber }
  bilder/team-6.jpg: { alt: Porträt Clara Neumann }
  downloads/creuva-broschuere.pdf: { title: Creuva-Broschüre }
  downloads/projekt-checkliste.pdf: { title: Checkliste für Ihr Website-Projekt }

# Image sizes of the theme (tl_image_size, media queries in "items"), referenced
# with image_size:<key>; "logo" is used for the logo of the header and brand module
imageSizes:
  logo: { name: 'Logo', width: 480, height: 120, resizeMode: 'box', densities: '2x', skipIfDimensionsMatch: true }
  hero: { name: 'Hero', width: 900, height: 975, resizeMode: 'crop', densities: '1.5x' }
  card: { name: 'Karte (4:3)', width: 800, height: 600, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  wide:
    name: Breit (16:9)
    width: 1200
    height: 675
    resizeMode: crop
    lazyLoading: true
    items:
      - { media: '(max-width: 40rem)', width: 640, height: 480, resizeMode: 'crop', densities: '2x' }
  team: { name: 'Team (1:1)', width: 480, height: 480, resizeMode: 'crop', densities: '1.5x', lazyLoading: true }
  avatar: { name: 'Avatar', width: 120, height: 120, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  news: { name: 'News-Teaser (16:10)', width: 800, height: 500, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  news-detail: { name: 'News-Detail', width: 1200, height: 700, resizeMode: 'crop' }

header:
  cta: { page: 'kontakt', title: 'Projekt starten' }

brand:
  claim: "Digitale Lösungen für eine\nlebenswerte Zukunft."
  social:
    - https://www.instagram.com/
    - https://www.linkedin.com/
    - https://x.com/
    - https://www.youtube.com/

footer:
  - { headline: 'Leistungen', pages: ['webdesign', 'entwicklung', 'beratung', 'preise'] }
  - { headline: 'Unternehmen', pages: ['ueber-uns', 'team', 'projekte', 'kontakt'] }
  - { headline: 'Wissen', pages: ['wissen', 'faq', 'downloads', 'styleguide'] }
  - { headline: 'Rechtliches', pages: ['impressum', 'datenschutz'] }

forms:
  kontakt:
    title: Kontaktformular
    jumpTo: page:danke
    method: POST
    fields:
      - { type: 'text', name: 'name', label: 'Ihr Name', mandatory: true, placeholder: 'Vor- und Nachname' }
      - { type: 'text', name: 'email', label: 'E-Mail-Adresse', mandatory: true, rgxp: 'email', placeholder: 'name@beispiel.de' }
      - { type: 'text', name: 'phone', label: 'Telefon', rgxp: 'phone' }
      - type: select
        name: topic
        label: Worum geht es?
        options:
          - { value: 'website', label: 'Neue Website' }
          - { value: 'relaunch', label: 'Relaunch' }
          - { value: 'beratung', label: 'Beratung' }
          - { value: 'sonstiges', label: 'Sonstiges' }
      - { type: 'textarea', name: 'message', label: 'Ihre Nachricht', mandatory: true, size: ['6', '40'] }
      - type: checkbox
        name: privacy
        mandatory: true
        options:
          - { value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }
      - { type: 'submit', slabel: 'Nachricht senden' }

news:
  wissen:
    title: News & Wissen
    jumpTo: page:beitrag
    items:
      - headline: Barrierefreiheit wird Pflicht – was Websites jetzt brauchen
        alias: barrierefreiheit-wird-pflicht
        date: -3 days
        subheadline: Das Barrierefreiheitsstärkungsgesetz im Überblick
        teaser: <p>Seit Juni 2025 gelten neue Anforderungen an viele Websites und Online-Shops. Wir zeigen, worauf es ankommt und wie Sie Ihre Website fit machen.</p>
        singleSRC: file:bilder/news-1.jpg
        elements:
          - type: text
            text: |
              <p>Barrierefreiheit ist mehr als eine gesetzliche Vorgabe – sie sorgt dafür, dass alle Menschen Ihre Inhalte nutzen können. Davon profitieren auch Suchmaschinen und mobile Nutzer.</p>
              <h2>Die wichtigsten Punkte</h2>
              <ul><li>Ausreichende Farbkontraste und skalierbare Schrift</li><li>Bedienbarkeit per Tastatur</li><li>Alternativtexte für Bilder</li><li>Verständliche Formulare mit klaren Fehlermeldungen</li></ul>
              <blockquote><p>Eine barrierefreie Website ist eine bessere Website – für alle.</p></blockquote>
              <p>Creuva unterstützt Sie dabei mit semantischem Markup, gut lesbaren Kontrasten und Tastaturbedienung.</p>
      - headline: Fünf Tipps für schnellere Ladezeiten
        alias: tipps-schnellere-ladezeiten
        date: -12 days
        teaser: <p>Schnelle Websites halten Besucher und ranken besser. Mit diesen fünf Maßnahmen holen Sie mehr aus Ihrer Contao-Installation heraus.</p>
        singleSRC: file:bilder/news-2.jpg
        elements:
          - type: text
            text: |
              <ol><li><strong>Bilder optimieren</strong> – moderne Formate und passende Größen.</li><li><strong>Caching nutzen</strong> – der Contao-Cache liefert Seiten in Millisekunden.</li><li><strong>Schriften selbst hosten</strong> – spart Anfragen an Drittanbieter.</li><li><strong>Skripte reduzieren</strong> – nur laden, was wirklich gebraucht wird.</li><li><strong>Ladezeiten messen</strong> – regelmäßig mit Lighthouse prüfen.</li></ol>
      - headline: Relaunch mit Contao 6 – so gelingt der Umstieg
        alias: relaunch-contao-6
        date: -26 days
        teaser: <p>Contao 6 setzt konsequent auf Twig-Templates. Wir erklären, wie Sie Ihr Projekt planen und was beim Umstieg zu beachten ist.</p>
        singleSRC: file:bilder/news-3.jpg
        elements:
          - type: text
            text: <p>Mit Contao 6 entfallen die alten PHP-Templates. Themes und Erweiterungen, die bereits auf Twig setzen – wie Creuva – lassen sich ohne Umwege weiterverwenden.</p>
      - headline: Designsysteme statt Einzelseiten
        alias: designsysteme-statt-einzelseiten
        date: -40 days
        teaser: <p>Wiederverwendbare Komponenten sparen Zeit und sorgen für ein einheitliches Erscheinungsbild. So bauen Sie Ihre Website wie ein Baukasten.</p>
        singleSRC: file:bilder/news-4.jpg
        elements:
          - type: text
            text: <p>Statt jede Seite einzeln zu gestalten, setzen Designsysteme auf Farben, Abstände und Komponenten, die überall gleich funktionieren. Redakteure kombinieren sie frei – das Ergebnis bleibt stimmig.</p>

modules:
  newslatest: { name: 'News – Neueste', type: 'newslist', news_archives: ['news_archive:wissen'], numberOfItems: 3, imgSize: 'image_size:news' }
  newslist: { name: 'News – Liste', type: 'newslist', news_archives: ['news_archive:wissen'], perPage: 6, imgSize: 'image_size:news' }
  newsreader: { name: 'News – Leser', type: 'newsreader', news_archives: ['news_archive:wissen'], overviewPage: 'page:wissen', imgSize: 'image_size:news-detail' }
  breadcrumb: { name: 'Breadcrumb', type: 'breadcrumb' }
  sitemap: { name: 'Sitemap', type: 'sitemap' }

pages:
  # 01 · Startseite
  - title: Startseite
    alias: index
    articles:
      - title: Hero
        elements:
          - type: creuva_hero
            creuvaKicker: Ideen. Design. Technologie.
            headline: { unit: 'h1', value: 'Digitale Erlebnisse, die' }
            creuvaHeadlineAccent: begeistern.
            text: <p>Wir gestalten und entwickeln Websites, die nicht nur gut aussehen, sondern Wirkung zeigen – für Marken, Menschen und messbare Ergebnisse.</p>
            singleSRC: file:bilder/hero.jpg
            size: 'image_size:hero'
            creuvaHeroMask: organic
            creuvaBadge: "Kreativ\nStrategisch\nZukunftssicher"
            creuvaUrl1: '{{link_url::kontakt}}'
            creuvaLinkTitle1: Projekt starten
            creuvaUrl2: '{{link_url::leistungen}}'
            creuvaLinkTitle2: Unsere Leistungen
      - title: Leistungen
        cssID: ['', 'u-bg-surface']
