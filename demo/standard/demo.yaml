          - type: creuva_hero
            creuvaKicker: Leistungen
            headline: { unit: 'h1', value: 'Alles für Ihren digitalen Auftritt –' }
            creuvaHeadlineAccent: aus einer Hand.
            text: <p>Von der Strategie über das Design bis zur technischen Umsetzung und Betreuung begleiten wir Sie durch jede Phase Ihres Projekts.</p>
            singleSRC: file:bilder/detail-2.jpg
            size: ['900', '975', 'crop']
            creuvaHeroMask: rounded
            creuvaUrl1: '{{link_url::kontakt}}'
            creuvaLinkTitle1: Beratung anfragen
