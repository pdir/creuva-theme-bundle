          - { type: 'creuva_hero', creuvaKicker: 'Referenzen', headline: { unit: 'h1', value: 'Projekte, auf die wir' }, creuvaHeadlineAccent: 'stolz sind.', text: '<p>Ein Auszug aus unserer Arbeit – von der Unternehmenswebsite bis zum Online-Magazin.</p>', creuvaHeroMask: 'none' }
