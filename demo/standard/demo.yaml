                  - { type: 'text', customTpl: 'content_element/text/creuva_feature', cssID: 'u-feature-plain', headline: { unit: 'h3', value: 'Persönlicher Kontakt' }, text: '<p>Direkter Austausch mit festen Ansprechpartnern.</p>', addImage: true, singleSRC: 'file:icons/team.svg' }
                  - { type: 'text', customTpl: 'content_element/text/creuva_feature', cssID: 'u-feature-plain', headline: { unit: 'h3', value: 'Individuelle Lösungen' }, text: '<p>Keine starren Prozesse, sondern maßgeschneiderte Unterstützung.</p>', addImage: true, singleSRC: 'file:icons/zahnrad.svg' }
