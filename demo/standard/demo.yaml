              - { type: 'text', customTpl: 'content_element/text/creuva_card', subline: 'Branding · Website', headline: { unit: 'h3', value: 'Nordlicht Studio' }, text: '<p>Dunkles, kreatives Design für ein Fotostudio.</p><p><a href="{{link_url::projekt-nordlicht}}">Projekt ansehen</a></p>', addImage: true, singleSRC: 'file:bilder/projekt-nordlicht.jpg', size: 'image_size:card' }
