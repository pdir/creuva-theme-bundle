# Image sizes of the theme (tl_image_size, media queries in "items"), referenced
# with image_size:<key>; "logo" is used for the logo of the header and brand module
imageSizes:
  logo: { name: 'Logo', width: 480, height: 120, resizeMode: 'box', densities: '2x', skipIfDimensionsMatch: true }
  hero: { name: 'Hero', width: 612, height: 459, resizeMode: 'crop', densities: '1x, 2x' }
  card: { name: 'Karte (4:3)', width: 800, height: 600, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  wide:
    name: Breit (16:9)
    width: 1200
    height: 675
    resizeMode: crop
    lazyLoading: true
    items:
      - { media: '(max-width: 40rem)', width: 640, height: 480, resizeMode: 'crop', densities: '2x' }
  team: { name: 'Team (1:1)', width: 480, height: 480, resizeMode: 'crop', densities: '1.5x', lazyLoading: true }
  avatar: { name: 'Avatar', width: 120, height: 120, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  news: { name: 'News-Teaser (16:10)', width: 800, height: 500, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  news-detail: { name: 'News-Detail', width: 1200, height: 700, resizeMode: 'crop' }
  # Galleries with mosaic/featured layout: proportional, several widths, the
  # browser loads the width that fits the cell (cropped by CSS, object-fit)
  gallery: { name: 'Galerie (responsiv)', width: 1600, resizeMode: 'proportional', densities: '480w, 800w, 1200w, 1600w', sizes: '(min-width: 64rem) 50vw, 100vw', lazyLoading: true }

header:
  cta: { page: 'kontakt', title: 'Projekt starten' }

brand:
  claim: "Digitale Lösungen für eine\nlebenswerte Zukunft."
  social:
    - https://www.instagram.com/
    - https://www.linkedin.com/
    - https://x.com/
    - https://www.youtube.com/

footer:
  - { headline: 'Leistungen', pages: ['webdesign', 'entwicklung', 'beratung', 'preise'] }
  - { headline: 'Unternehmen', pages: ['ueber-uns', 'team', 'projekte', 'kontakt'] }
  - { headline: 'Wissen', pages: ['wissen', 'faq', 'downloads', 'styleguide'] }
  - { headline: 'Rechtliches', pages: ['impressum', 'datenschutz'] }

forms:
  kontakt:
    title: Kontaktformular
    jumpTo: page:danke
    method: POST
    fields:
      - { type: 'text', name: 'name', label: 'Ihr Name', mandatory: true, placeholder: 'Vor- und Nachname' }
      - { type: 'text', name: 'email', label: 'E-Mail-Adresse', mandatory: true, rgxp: 'email', placeholder: 'name@beispiel.de' }
      - { type: 'text', name: 'phone', label: 'Telefon', rgxp: 'phone' }
      - type: select
        name: topic
        label: Worum geht es?
        options:
          - { value: 'website', label: 'Neue Website' }
          - { value: 'relaunch', label: 'Relaunch' }
          - { value: 'beratung', label: 'Beratung' }
          - { value: 'sonstiges', label: 'Sonstiges' }
      - { type: 'textarea', name: 'message', label: 'Ihre Nachricht', mandatory: true, size: ['6', '40'] }
      - type: checkbox
        name: privacy
        mandatory: true
        options:
          - { value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }
      - { type: 'submit', slabel: 'Nachricht senden' }

news:
  wissen:
    title: News & Wissen
    jumpTo: page:beitrag
    items:
      - headline: Barrierefreiheit wird Pflicht – was Websites jetzt brauchen
        alias: barrierefreiheit-wird-pflicht
        creuvaHeadlineAccent: Barrierefreiheit wird Pflicht
        date: -3 days
        subheadline: 'Das Barrierefreiheitsstärkungsgesetz im Überblick'
        teaser: '<p>Seit dem 28. Juni 2025 gilt das Barrierefreiheitsstärkungsgesetz. Wir zeigen, welche Websites betroffen sind, was die WCAG verlangen und wie Sie Ihre Website Schritt für Schritt fit machen.</p>'
        singleSRC: file:bilder/news-1.jpg
        elements:
          - type: text
            cssID: u-lead
            text: '<p>Barrierefreiheit ist mehr als eine gesetzliche Vorgabe – sie sorgt dafür, dass alle Menschen Ihre Inhalte nutzen können: mit Screenreader, nur per Tastatur, mit Sehschwäche oder einfach unterwegs im grellen Sonnenlicht. Davon profitieren auch Suchmaschinen und mobile Nutzer.</p>'
          - type: text
            headline: { unit: h2, value: 'Wen betrifft das Gesetz?' }
            text: |
              <p>Das Barrierefreiheitsstärkungsgesetz (BFSG) setzt den European Accessibility Act in deutsches Recht um. Es gilt für Produkte und Dienstleistungen, die sich an Verbraucherinnen und Verbraucher richten – im Web vor allem für <strong>Online-Shops, Buchungsstrecken, Bankdienstleistungen und alles, was zu einem Vertragsabschluss führt</strong>.</p>
              <p>Reine Informationsseiten ohne Bestellfunktion fallen in der Regel nicht direkt unter das Gesetz. Spätestens mit dem ersten Kontakt- oder Terminformular lohnt sich aber ein genauer Blick – und barrierearme Seiten sind ohnehin besser bedienbar.</p>
          - type: description_list
            customTpl: content_element/description_list/creuva_facts
            headline: { unit: h3, value: 'Das BFSG auf einen Blick' }
            data:
              - { key: 'Gilt seit', value: '28. Juni 2025' }
              - { key: 'Grundlage', value: 'European Accessibility Act (EU-Richtlinie 2019/882)' }
              - { key: 'Technischer Maßstab', value: 'EN 301 549, entspricht im Web WCAG 2.1 Stufe AA' }
              - { key: 'Ausnahme', value: 'Kleinstunternehmen mit weniger als 10 Beschäftigten und höchstens 2 Mio. € Jahresumsatz (bei Dienstleistungen)' }
              - { key: 'Pflichtangabe', value: 'Erklärung zur Barrierefreiheit auf der Website' }
          - type: text
            headline: { unit: h2, value: 'Die vier Prinzipien der WCAG' }
            text: '<p>Die Web Content Accessibility Guidelines ordnen alle Anforderungen vier Grundprinzipien zu. Wer sie im Blick behält, hat die meisten Punkte schon abgedeckt.</p>'
          - type: element_group
            cssID: u-grid-2
            children:
              - { type: text, customTpl: content_element/text/creuva_feature, cssID: u-feature-inline, headline: { unit: h3, value: Wahrnehmbar }, text: '<p>Inhalte lassen sich sehen, hören oder ertasten – mit Alternativtexten, Untertiteln und ausreichendem Kontrast.</p>', addImage: true, singleSRC: 'file:icons/stern.svg' }
              - { type: text, customTpl: content_element/text/creuva_feature, cssID: u-feature-inline, headline: { unit: h3, value: Bedienbar }, text: '<p>Alle Funktionen sind per Tastatur erreichbar, der Fokus ist sichtbar und niemand steckt in einem Dialog fest.</p>', addImage: true, singleSRC: 'file:icons/zahnrad.svg' }
              - { type: text, customTpl: content_element/text/creuva_feature, cssID: u-feature-inline, headline: { unit: h3, value: Verständlich }, text: '<p>Klare Sprache, eine vorhersehbare Navigation und Formulare, die Fehler verständlich erklären.</p>', addImage: true, singleSRC: 'file:icons/beratung.svg' }
              - { type: text, customTpl: content_element/text/creuva_feature, cssID: u-feature-inline, headline: { unit: h3, value: Robust }, text: '<p>Sauberes, semantisches HTML, das Browser und Hilfsmittel wie Screenreader zuverlässig auslesen.</p>', addImage: true, singleSRC: 'file:icons/schild.svg' }
          - type: text
            customTpl: content_element/text/creuva_media
            creuvaKicker: 'Praxis'
            headline: 'gut lesbar.'
            subline: 'Kontraste, die'
            headline_inline: '1'
            text: '<p>Fließtext braucht ein Kontrastverhältnis von mindestens 4,5 : 1, große Schrift und Bedienelemente mindestens 3 : 1. Die Farbschemas von Creuva sind darauf abgestimmt – auch in der dunklen Variante.</p><ul><li>Schrift lässt sich auf 200 % vergrößern</li><li>Farbe ist nie die einzige Information</li><li>Links sind auch ohne Farbe erkennbar</li></ul>'
            addImage: true
            singleSRC: 'file:bilder/detail-3.jpg'
            size: 'image_size:card'
            floating: left
          - type: text
            headline: { unit: h2, value: 'Checkliste für Ihre Website' }
            text: |
              <ul><li>Ausreichende Farbkontraste und skalierbare Schrift</li><li>Bedienbarkeit per Tastatur mit sichtbarem Fokus</li><li>Aussagekräftige Alternativtexte für Bilder</li><li>Logische Überschriftenstruktur (H1, H2, H3 …)</li><li>Verständliche Formulare mit klaren Fehlermeldungen</li><li>Untertitel oder Transkripte für Videos</li><li>Erklärung zur Barrierefreiheit mit Feedback-Möglichkeit</li></ul>
              <blockquote><p>Eine barrierefreie Website ist eine bessere Website – für alle.</p></blockquote>
          - type: accordion
            cssID: u-accordion-icon
            children:
              - { type: text, sectionHeadline: { unit: h3, value: 'Gilt das BFSG auch für meine Unternehmenswebsite?' }, text: '<p>Wenn Verbraucher über Ihre Website einen Vertrag abschließen können – etwa im Shop, bei einer Buchung oder einer Online-Anmeldung –, sehr wahrscheinlich ja. Reine Imageseiten sind meist nicht direkt betroffen.</p>' }
              - { type: text, sectionHeadline: { unit: h3, value: 'Was passiert bei Verstößen?' }, text: '<p>Die Marktüberwachungsbehörden der Länder können Mängel beanstanden, die Beseitigung anordnen und Bußgelder von bis zu 100.000 € verhängen. Hinzu kommt das Risiko von Abmahnungen durch Mitbewerber.</p>' }
              - { type: text, sectionHeadline: { unit: h3, value: 'Wie lange dauert die Umstellung?' }, text: '<p>Bei einer modernen Contao-Website mit sauberem Theme reichen oft wenige Tage für Prüfung und Korrekturen. Ältere Websites mit vielen Sonderlösungen brauchen mehr Zeit – manchmal ist ein Relaunch der schnellere Weg.</p>' }
          - type: text
            customTpl: content_element/text/simplebox
            headline: { unit: h3, value: 'Hinweis' }
            text: '<p>Dieser Beitrag gibt einen Überblick und ersetzt keine Rechtsberatung. Ob und in welchem Umfang Ihr Angebot unter das BFSG fällt, klären Sie im Zweifel mit einer Fachanwältin oder einem Fachanwalt.</p>'
          - type: text
            customTpl: content_element/text/creuva_cta
            cssID: u-card-soft u-cta-stacked
            creuvaKicker: 'Barrierefreiheits-Check'
            headline: 'barrierefrei?'
            subline: 'Wie gut ist Ihre Website'
            headline_inline: '1'
            text: '<p>Wir prüfen Ihre Website nach WCAG 2.1 AA und zeigen Ihnen, welche Punkte Sie zuerst angehen sollten.</p><p><a href="{{link_url::kontakt}}">Check anfragen</a></p>'
      - headline: Fünf Tipps für schnellere Ladezeiten
        alias: tipps-schnellere-ladezeiten
        date: -12 days
        teaser: '<p>Schnelle Websites halten Besucher und ranken besser. Mit diesen fünf Maßnahmen holen Sie mehr aus Ihrer Contao-Installation heraus – inklusive Zahlen aus einem echten Relaunch.</p>'
        subheadline: 'Core Web Vitals verstehen und verbessern'
        singleSRC: file:bilder/news-2.jpg
        elements:
          - type: text
            cssID: u-lead
            text: '<p>Jede Sekunde Ladezeit kostet Aufmerksamkeit. Google bewertet die Nutzererfahrung seit Jahren mit den Core Web Vitals – drei Messwerten, die zeigen, wie schnell eine Seite lädt, wie flott sie reagiert und wie ruhig sie sich aufbaut.</p>'
          - type: description_list
            customTpl: content_element/description_list/creuva_stats
            creuvaKicker: 'Core Web Vitals'
            headline: 'Diese Werte zählen.'
            cssID: u-bg-accent u-text-center
            creuvaIcons: ['file:icons/performance.svg', 'file:icons/uhr.svg', 'file:icons/raute.svg']
            data:
              - { key: '≤ 2,5 s', value: 'Largest Contentful Paint' }
              - { key: '≤ 200 ms', value: 'Interaction to Next Paint' }
              - { key: '≤ 0,1', value: 'Cumulative Layout Shift' }
          - type: text
            customTpl: content_element/text/creuva_media
            creuvaKicker: 'Tipp 1'
            headline: 'optimieren.'
            subline: 'Bilder'
            headline_inline: '1'
            text: '<p>Bilder sind fast immer der größte Brocken. Contao erzeugt über die Bildgrößen im Theme automatisch passende Varianten für jedes Gerät – Sie müssen sie nur sinnvoll anlegen.</p><ul><li>Moderne Formate wie AVIF und WebP</li><li>srcset und sizes für unterschiedliche Bildschirme</li><li>Lazy Loading für alles unterhalb des sichtbaren Bereichs</li></ul>'
            addImage: true
            singleSRC: 'file:bilder/detail-1.jpg'
            size: 'image_size:card'
            floating: right
          - type: element_group
            cssID: u-grid-2
            children:
              - { type: text, customTpl: content_element/text/creuva_feature, headline: { unit: h3, value: '2. Caching nutzen' }, text: '<p>Der HTTP-Cache von Contao liefert Seiten ohne erneuten Datenbankzugriff aus – oft in wenigen Millisekunden. Legen Sie in den Seiteneinstellungen eine sinnvolle Cache-Zeit fest.</p>', addImage: true, singleSRC: 'file:icons/zahnrad.svg' }
              - { type: text, customTpl: content_element/text/creuva_feature, headline: { unit: h3, value: '3. Schriften selbst hosten' }, text: '<p>Lokal eingebundene Webfonts sparen Anfragen an Drittanbieter, sind datenschutzfreundlich und lassen sich mit font-display: swap ohne Flackern laden.</p>', addImage: true, singleSRC: 'file:icons/ebenen.svg' }
              - { type: text, customTpl: content_element/text/creuva_feature, headline: { unit: h3, value: '4. Skripte reduzieren' }, text: '<p>Jedes Tracking-Tool und jedes Slider-Plugin kostet Ladezeit. Laden Sie nur, was wirklich gebraucht wird – und das möglichst mit defer.</p>', addImage: true, singleSRC: 'file:icons/entwicklung.svg' }
              - { type: text, customTpl: content_element/text/creuva_feature, headline: { unit: h3, value: '5. Regelmäßig messen' }, text: '<p>Lighthouse und PageSpeed Insights zeigen Schwachstellen in Minuten. Wichtiger noch sind die Felddaten echter Besucher in der Search Console.</p>', addImage: true, singleSRC: 'file:icons/performance.svg' }
          - type: table
            headline: { unit: h2, value: 'Vorher und nachher: ein Beispiel' }
            cssID: u-table-compare
            thead: true
            tableitems:
              - [Messwert, 'Alte Website', 'Nach dem Relaunch']
              - ['Largest Contentful Paint', '4,1 s', '1,6 s']
              - ['Seitengewicht Startseite', '3,8 MB', '0,9 MB']
              - ['Anfragen beim Laden', '86', '31']
              - ['Lighthouse Performance (mobil)', '54', '97']
          - type: text
            cssID: u-muted
            text: '<p>Werte gemessen mit Lighthouse (mobil, gedrosselt) auf der Startseite des Serviceportals der Stadtwerke Elbtal vor und nach dem Relaunch.</p>'
          - type: text
            customTpl: content_element/text/creuva_testimonial
            cssID: u-card-outline-accent
            headline: { unit: h3, value: 'Sandra Wolff' }
            subline: 'Leitung Online-Services, Stadtwerke Elbtal'
            text: '<p>Seit dem Relaunch lädt unser Störungsmelder auch im Mobilfunknetz in unter zwei Sekunden. Die Zahl der Anrufe an der Hotline ist spürbar gesunken.</p>'
          - type: text
            customTpl: content_element/text/creuva_cta
            cssID: u-card-muted
            creuvaKicker: 'Performance-Check'
            headline: 'Ihre Website?'
            subline: 'Wie schnell ist'
            headline_inline: '1'
            text: '<p>Wir messen Ihre Website und zeigen Ihnen die drei Maßnahmen mit der größten Wirkung.</p><p><a href="{{link_url::kontakt}}">Check anfragen</a></p>'
      - headline: Relaunch mit Contao 6 – so gelingt der Umstieg
        alias: relaunch-contao-6
        creuvaHeadlineAccent: Relaunch mit Contao 6
        date: -26 days
        teaser: '<p>Contao 6 setzt konsequent auf Twig-Templates. Wir erklären, wie Sie den Umstieg planen, wann sich ein Update lohnt und wann ein Relaunch der bessere Weg ist.</p>'
        subheadline: 'Planung, Ablauf und typische Stolpersteine'
        singleSRC: file:bilder/news-3.jpg
        elements:
          - type: text
            cssID: u-lead
            text: '<p>Mit Contao 6 entfallen die alten PHP-Templates endgültig. Themes und Erweiterungen, die bereits auf Twig setzen – wie Creuva –, lassen sich ohne Umwege weiterverwenden. Für viele ältere Websites ist der Versionssprung dagegen ein guter Anlass, Inhalte und Design neu zu denken.</p>'
          - type: element_group
            cssID: u-grid-2
            children:
              - { type: text, cssID: u-card, headline: { unit: h3, value: 'Was bleibt' }, text: '<ul><li>Seitenstruktur, Artikel und Inhaltselemente</li><li>Dateiverwaltung mit allen Metadaten</li><li>Benutzer, Rechte und Formulare</li><li>Twig-Templates aus Contao 5</li></ul>' }
              - { type: text, cssID: u-card u-bg-accent, headline: { unit: h3, value: 'Was sich ändert' }, text: '<ul><li>Keine .html5-Templates mehr</li><li>Neue Mindestversionen von PHP und Symfony</li><li>Veraltete Erweiterungen brauchen ein Update</li><li>Eigene Anpassungen werden geprüft</li></ul>' }
          - type: table
            headline: { unit: h2, value: 'Update oder Relaunch?' }
            cssID: u-table-compare
            thead: true
            tableitems:
              - ['', Update, Relaunch]
              - [Aufwand, 'gering bis mittel', 'mittel bis hoch']
              - [Design, 'bleibt', 'wird neu gestaltet']
              - [Inhalte, 'werden übernommen', 'werden überarbeitet']
