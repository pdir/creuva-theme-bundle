  # 09 · Kontakt
  - title: Kontakt
    alias: kontakt
    articles:
      - title: Intro
        elements:
          - { type: 'creuva_hero', creuvaKicker: 'Kontakt', headline: { unit: 'h1', value: 'Lassen Sie uns' }, creuvaHeadlineAccent: 'sprechen.', text: '<p>Wir freuen uns auf Ihre Nachricht und melden uns innerhalb eines Werktags.</p>', creuvaHeroMask: 'none' }
