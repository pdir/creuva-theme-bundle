                  - type: text
                    headline: 'Über das Projekt'
                    text: |-
                      <p>Die bisherige Website war unübersichtlich, auf mobilen Geräten nur eingeschränkt nutzbar und bot Interessenten wenig Orientierung bei der Wahl des passenden Energietarifs. Ziel des Relaunches war ein zeitgemäßer Webauftritt, der die regionale Verbundenheit des Unternehmens mit einem klaren Bekenntnis zu Nachhaltigkeit und zukunftsfähiger Energieversorgung verbindet. Gleichzeitig sollten wichtige Informationen schneller auffindbar sein und der Weg von der ersten Recherche bis zur konkreten Anfrage deutlich kürzer werden.</p>
                      <p>Die neue Website setzt auf ein ruhiges, modernes Design, großflächige Bildwelten und eine intuitive Navigation. Verständlich aufbereitete Tarifinformationen, übersichtliche Servicebereiche und gut sichtbare Kontaktmöglichkeiten erleichtern die Orientierung. Inhalte rund um nachhaltige Energie, regionale Verantwortung und die Leistungen des Unternehmens erhalten einen eigenen Platz und stärken das Profil von Grünwerk Energie.</p>
                      <p>Auch die technische Umsetzung wurde konsequent auf Alltagstauglichkeit ausgelegt. Die Website funktioniert auf Smartphones, Tablets und Desktopgeräten gleichermaßen und bietet eine suchmaschinenfreundliche Seitenstruktur. Dank Contao kann das Marketing-Team Inhalte, aktuelle Meldungen und Serviceinformationen eigenständig pflegen und erweitern – ohne für jede Änderung auf externe Unterstützung angewiesen zu sein.</p>
