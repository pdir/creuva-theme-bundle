            children:
              - { type: 'text', customTpl: 'content_element/text/creuva_testimonial', headline: { unit: 'h3', value: 'Julia Berger' }, subline: 'Geschäftsführerin, Grünwerk Energie', text: '<p>Vom ersten Workshop bis zum Launch lief alles reibungslos. Unsere neue Website bringt spürbar mehr Anfragen.</p>', addImage: true, singleSRC: 'file:bilder/team-2.jpg', size: 'image_size:avatar', overwriteMeta: true, alt: 'Julia Berger' }
              - { type: 'text', customTpl: 'content_element/text/creuva_testimonial', headline: { unit: 'h3', value: 'Markus Lehmann' }, subline: 'Inhaber, Nordlicht Studio', text: '<p>Creuva hat unsere Bildsprache perfekt in Szene gesetzt. Die Pflege im Backend ist kinderleicht.</p>', addImage: true, singleSRC: 'file:bilder/team-1.jpg', size: 'image_size:avatar', overwriteMeta: true, alt: 'Markus Lehmann' }
              - { type: 'text', customTpl: 'content_element/text/creuva_testimonial', headline: { unit: 'h3', value: 'Sabine Huber' }, subline: 'Hotel Alpenhof', text: '<p>Endlich eine Website, die so einladend ist wie unser Haus. Die Online-Anfragen haben sich verdoppelt.</p>', addImage: true, singleSRC: 'file:bilder/team-4.jpg', size: 'image_size:avatar', overwriteMeta: true, alt: 'Sabine Huber' }
