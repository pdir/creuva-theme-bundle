        elements:
          - type: element_group
            cssID: u-grid-2
            children:
              - type: text
                headline: So erreichen Sie uns
                text: '<p><strong>Creuva Demo GmbH</strong><br>Musterstraße 1<br>01067 Dresden</p><p>Telefon: <a href="tel:+49351000000">+49 351 000000</a><br>E-Mail: <a href="mailto:hallo@example.com">hallo@example.com</a></p><p>Montag bis Freitag, 9 bis 17 Uhr</p>'
                cssID: u-bg-muted
              - { type: 'form', form: 'form:kontakt', headline: 'Schreiben Sie uns' }
