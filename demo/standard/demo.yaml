            customTpl: content_element/text/creuva_media
            creuvaKicker: Kreative Partner auf Augenhöhe
            headline: Agentur.
            subline: Mehr als nur eine
            headline_inline: '1'
            text: <p>Wir sind ein eingespieltes Team aus Designern, Entwicklern und Strategen. Unser Ziel – digitale Lösungen, die nicht nur funktionieren, sondern wirklich zu Ihnen passen.</p><ul><li>Individuelle Konzepte statt Baukasten</li><li>Persönliche Beratung und direkte Kommunikation</li><li>Langfristige Partnerschaften</li><li>Leidenschaft für gutes Design und sauberen Code</li></ul><p><a href="{{link_url::ueber-uns}}">Mehr über uns</a></p>
