              - { type: 'text', customTpl: 'content_element/text/creuva_team', headline: { unit: 'h3', value: 'Daniel Owusu' }, subline: 'Support', text: '<p><a href="mailto:support@example.com">support@example.com</a></p>', addImage: true, singleSRC: 'file:bilder/team-3.jpg', size: ['480', '480', 'crop'] }
