                          - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Was muss ich als Kunde bereitstellen?' }, text: '<p>Unsere <a href="{{link_url::downloads}}">Projekt-Checkliste</a> hilft bei der Vorbereitung.</p>' }
