                    cssID: u-accordion-icon
                    children:
                      - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Sind die Preise Endpreise?' }, text: '<p>Alle Preise verstehen sich einmalig zzgl. MwSt. Laufende Kosten für Hosting und Wartung vereinbaren wir separat.</p>' }
                      - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Was ist enthalten, was nicht?' }, text: '<p>Konzept, Design, Umsetzung und Schulung sind enthalten. Hosting, Domain und Lizenzen für Bilder sind nicht enthalten.</p>' }
