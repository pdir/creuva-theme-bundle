header:
  cta: { page: 'kontakt', title: 'Projekt starten' }

brand:
  claim: "Digitale Lösungen für eine\nlebenswerte Zukunft."
  social:
    - https://www.instagram.com/
    - https://www.linkedin.com/
    - https://x.com/
    - https://www.youtube.com/

footer:
  - { headline: 'Leistungen', pages: ['webdesign', 'entwicklung', 'beratung', 'preise'] }
  - { headline: 'Unternehmen', pages: ['ueber-uns', 'team', 'projekte', 'kontakt'] }
  - { headline: 'Wissen', pages: ['wissen', 'faq', 'downloads', 'elemente'] }
  - { headline: 'Rechtliches', pages: ['impressum', 'datenschutz'] }

forms:
  kontakt:
    title: Kontaktformular
    jumpTo: page:danke
    method: POST
    fields:
      - { type: 'text', name: 'name', label: 'Ihr Name', mandatory: true, placeholder: 'Vor- und Nachname' }
      - { type: 'text', name: 'email', label: 'E-Mail-Adresse', mandatory: true, rgxp: 'email', placeholder: 'name@beispiel.de' }
      - { type: 'text', name: 'phone', label: 'Telefon', rgxp: 'phone' }
      - type: select
        name: topic
        label: Worum geht es?
        options:
          - { value: 'website', label: 'Neue Website' }
          - { value: 'relaunch', label: 'Relaunch' }
          - { value: 'beratung', label: 'Beratung' }
          - { value: 'sonstiges', label: 'Sonstiges' }
      - { type: 'textarea', name: 'message', label: 'Ihre Nachricht', mandatory: true, size: ['6', '40'] }
      - type: checkbox
        name: privacy
        mandatory: true
        options:
          - { value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }
      - { type: 'submit', slabel: 'Nachricht senden' }

news:
  wissen:
    title: News & Wissen
    jumpTo: page:beitrag
    items:
      - headline: Barrierefreiheit wird Pflicht – was Websites jetzt brauchen
        alias: barrierefreiheit-wird-pflicht
        date: -3 days
        subheadline: Das Barrierefreiheitsstärkungsgesetz im Überblick
        teaser: <p>Seit Juni 2025 gelten neue Anforderungen an viele Websites und Online-Shops. Wir zeigen, worauf es ankommt und wie Sie Ihre Website fit machen.</p>
        singleSRC: file:bilder/news-1.jpg
        elements:
          - type: text
            text: |
              <p>Barrierefreiheit ist mehr als eine gesetzliche Vorgabe – sie sorgt dafür, dass alle Menschen Ihre Inhalte nutzen können. Davon profitieren auch Suchmaschinen und mobile Nutzer.</p>
              <h2>Die wichtigsten Punkte</h2>
              <ul><li>Ausreichende Farbkontraste und skalierbare Schrift</li><li>Bedienbarkeit per Tastatur</li><li>Alternativtexte für Bilder</li><li>Verständliche Formulare mit klaren Fehlermeldungen</li></ul>
              <blockquote><p>Eine barrierefreie Website ist eine bessere Website – für alle.</p></blockquote>
              <p>Creuva unterstützt Sie dabei mit semantischem Markup, gut lesbaren Kontrasten und Tastaturbedienung.</p>
      - headline: Fünf Tipps für schnellere Ladezeiten
        alias: tipps-schnellere-ladezeiten
        date: -12 days
        teaser: <p>Schnelle Websites halten Besucher und ranken besser. Mit diesen fünf Maßnahmen holen Sie mehr aus Ihrer Contao-Installation heraus.</p>
        singleSRC: file:bilder/news-2.jpg
        elements:
          - type: text
            text: |
              <ol><li><strong>Bilder optimieren</strong> – moderne Formate und passende Größen.</li><li><strong>Caching nutzen</strong> – der Contao-Cache liefert Seiten in Millisekunden.</li><li><strong>Schriften selbst hosten</strong> – spart Anfragen an Drittanbieter.</li><li><strong>Skripte reduzieren</strong> – nur laden, was wirklich gebraucht wird.</li><li><strong>Ladezeiten messen</strong> – regelmäßig mit Lighthouse prüfen.</li></ol>
      - headline: Relaunch mit Contao 6 – so gelingt der Umstieg
        alias: relaunch-contao-6
        date: -26 days
        teaser: <p>Contao 6 setzt konsequent auf Twig-Templates. Wir erklären, wie Sie Ihr Projekt planen und was beim Umstieg zu beachten ist.</p>
        singleSRC: file:bilder/news-3.jpg
        elements:
          - type: text
            text: <p>Mit Contao 6 entfallen die alten PHP-Templates. Themes und Erweiterungen, die bereits auf Twig setzen – wie Creuva – lassen sich ohne Umwege weiterverwenden.</p>
      - headline: Designsysteme statt Einzelseiten
        alias: designsysteme-statt-einzelseiten
        date: -40 days
        teaser: <p>Wiederverwendbare Komponenten sparen Zeit und sorgen für ein einheitliches Erscheinungsbild. So bauen Sie Ihre Website wie ein Baukasten.</p>
        singleSRC: file:bilder/news-4.jpg
        elements:
          - type: text
            text: <p>Statt jede Seite einzeln zu gestalten, setzen Designsysteme auf Farben, Abstände und Komponenten, die überall gleich funktionieren. Redakteure kombinieren sie frei – das Ergebnis bleibt stimmig.</p>

modules:
  newslatest: { name: 'News – Neueste', type: 'newslist', news_archives: ['news_archive:wissen'], numberOfItems: 3, imgSize: ['800', '500', 'crop'] }
  newslist: { name: 'News – Liste', type: 'newslist', news_archives: ['news_archive:wissen'], perPage: 6, imgSize: ['800', '500', 'crop'] }
  newsreader: { name: 'News – Leser', type: 'newsreader', news_archives: ['news_archive:wissen'], overviewPage: 'page:wissen', imgSize: ['1200', '700', 'crop'] }
  breadcrumb: { name: 'Breadcrumb', type: 'breadcrumb' }
  sitemap: { name: 'Sitemap', type: 'sitemap' }

pages:
  # 01 · Startseite
  - title: Startseite
    alias: index
    articles:
      - title: Hero
        elements:
          - type: creuva_hero
            creuvaKicker: Ideen. Design. Technologie.
            headline: { unit: 'h1', value: 'Digitale Erlebnisse, die' }
            creuvaHeadlineAccent: begeistern.
            text: <p>Wir gestalten und entwickeln Websites, die nicht nur gut aussehen, sondern Wirkung zeigen – für Marken, Menschen und messbare Ergebnisse.</p>
            singleSRC: file:bilder/hero.jpg
            size: ['900', '975', 'crop']
            creuvaHeroMask: organic
            creuvaBadge: "Kreativ\nStrategisch\nZukunftssicher"
            creuvaUrl1: '{{link_url::kontakt}}'
            creuvaLinkTitle1: Projekt starten
            creuvaUrl2: '{{link_url::leistungen}}'
            creuvaLinkTitle2: Unsere Leistungen
      - title: Leistungen
        elements:
          - { type: 'headline', headline: 'Unsere Leistungen', subline: 'Was wir tun' }
          - type: element_group
            cssID: u-grid-4
            children:
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Webdesign' }, text: '<p>Moderne, unabhängige Designs, die Ihre Marke perfekt repräsentieren.</p>', addImage: true, singleSRC: 'file:icons/webdesign.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Entwicklung' }, text: '<p>Saubere, performante Umsetzungen mit Contao und modernen Technologien.</p>', addImage: true, singleSRC: 'file:icons/entwicklung.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Beratung' }, text: '<p>Strategische Beratung für nachhaltige und erfolgreiche digitale Projekte.</p>', addImage: true, singleSRC: 'file:icons/beratung.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Support' }, text: '<p>Persönliche Betreuung – auch lange nach dem Launch.</p>', addImage: true, singleSRC: 'file:icons/support.svg' }
      - title: Agentur
        elements:
          - type: text
            headline: Agentur.
            subline: Mehr als nur eine
            headline_inline: '1'
            text: <p>Wir sind ein eingespieltes Team aus Designern, Entwicklern und Strategen. Gemeinsam mit Ihnen entwickeln wir digitale Lösungen, die begeistern und nachhaltig funktionieren.</p><ul><li>Individuelle Konzepte statt Baukasten</li><li>Persönliche Beratung und direkte Kommunikation</li><li>Langfristige Partnerschaften auf Augenhöhe</li></ul>
            addImage: true
            singleSRC: file:bilder/about.jpg
            size: ['800', '600', 'crop']
            floating: left
          - { type: 'hyperlink', url: '{{link_url::ueber-uns}}', linkTitle: 'Mehr über uns', cssID: 'u-button' }
      - title: Referenzen
        cssID: ['', 'u-bg-muted']
        elements:
          - { type: 'headline', headline: 'Ausgewählte Projekte', subline: 'Referenzen' }
          - type: element_group
            cssID: u-grid-3
            children:
              - { type: 'text', customTpl: 'content_element/text/creuva_card', subline: 'Webdesign · Contao', headline: { unit: 'h3', value: 'Grünwerk Energie' }, text: '<p>Neuer Auftritt für einen regionalen Energieversorger.</p><p><a href="{{link_url::projekt-gruenwerk}}">Projekt ansehen</a></p>', addImage: true, singleSRC: 'file:bilder/projekt-gruenwerk.jpg', size: ['800', '600', 'crop'] }
              - { type: 'text', customTpl: 'content_element/text/creuva_card', subline: 'Branding · Website', headline: { unit: 'h3', value: 'Nordlicht Studio' }, text: '<p>Dunkles, kreatives Design für ein Fotostudio.</p><p><a href="{{link_url::projekt-nordlicht}}">Projekt ansehen</a></p>', addImage: true, singleSRC: 'file:bilder/projekt-nordlicht.jpg', size: ['800', '600', 'crop'] }
              - { type: 'text', customTpl: 'content_element/text/creuva_card', subline: 'Tourismus · Buchung', headline: { unit: 'h3', value: 'Hotel Alpenhof' }, text: '<p>Warme Bildsprache und Online-Anfrage für ein Hotel.</p><p><a href="{{link_url::projekt-alpenhof}}">Projekt ansehen</a></p>', addImage: true, singleSRC: 'file:bilder/projekt-alpenhof.jpg', size: ['800', '600', 'crop'] }
          - { type: 'hyperlink', url: '{{link_url::projekte}}', linkTitle: 'Alle Projekte ansehen', cssID: 'u-button-secondary' }
      - title: Kennzahlen
        elements:
          - type: description_list
            customTpl: content_element/description_list/creuva_stats
            headline: Vertrauen. Erfahrung. Ergebnisse.
            cssID: u-bg-accent u-text-center
            data:
              - { key: '120+', value: 'Erfolgreiche Projekte' }
              - { key: '98 %', value: 'Zufriedene Kunden' }
              - { key: '15+', value: 'Jahre Erfahrung' }
              - { key: '24', value: 'Engagierte Köpfe' }
      - title: Kundenstimmen
        elements:
          - { type: 'headline', headline: 'Das sagen unsere Kunden', subline: 'Kundenstimmen' }
          - type: element_group
            cssID: u-grid-3
            children:
              - { type: 'text', customTpl: 'content_element/text/creuva_testimonial', headline: { unit: 'h3', value: 'Julia Berger' }, subline: 'Geschäftsführerin, Grünwerk Energie', text: '<p>Vom ersten Workshop bis zum Launch lief alles reibungslos. Unsere neue Website bringt spürbar mehr Anfragen.</p>', addImage: true, singleSRC: 'file:bilder/team-2.jpg', size: ['120', '120', 'crop'], overwriteMeta: true, alt: 'Julia Berger' }
              - { type: 'text', customTpl: 'content_element/text/creuva_testimonial', headline: { unit: 'h3', value: 'Markus Lehmann' }, subline: 'Inhaber, Nordlicht Studio', text: '<p>Creuva hat unsere Bildsprache perfekt in Szene gesetzt. Die Pflege im Backend ist kinderleicht.</p>', addImage: true, singleSRC: 'file:bilder/team-1.jpg', size: ['120', '120', 'crop'], overwriteMeta: true, alt: 'Markus Lehmann' }
              - { type: 'text', customTpl: 'content_element/text/creuva_testimonial', headline: { unit: 'h3', value: 'Sabine Huber' }, subline: 'Hotel Alpenhof', text: '<p>Endlich eine Website, die so einladend ist wie unser Haus. Die Online-Anfragen haben sich verdoppelt.</p>', addImage: true, singleSRC: 'file:bilder/team-4.jpg', size: ['120', '120', 'crop'], overwriteMeta: true, alt: 'Sabine Huber' }
      - title: Neuigkeiten
        elements:
          - { type: 'headline', headline: 'News & Wissen', subline: 'Aktuelles' }
          - { type: 'module', module: 'module:newslatest' }
      - title: CTA
        elements:
          - type: text
            headline: Lassen Sie uns gemeinsam Großes schaffen.
            subline: Bereit für Ihr nächstes Projekt?
            text: '<p>Ob neue Website, Relaunch oder Beratung – wir freuen uns darauf, Ihr Projekt kennenzulernen.</p><p><a href="{{link_url::kontakt}}">Jetzt Kontakt aufnehmen</a></p>'
            cssID: u-bg-primary

