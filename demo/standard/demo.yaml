            text: '<p>Wir prüfen Ihre Installation und sagen Ihnen, ob sich ein Update oder ein Relaunch mehr lohnt.</p><p><a href="{{link_url::kontakt}}">Erstgespräch vereinbaren</a> <a href="{{link_url::leistungen}}">Leistungen ansehen</a></p>'
      - headline: Designsysteme statt Einzelseiten
