              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Entwicklung' }, text: '<p>Contao-Websites, Erweiterungen und Schnittstellen.</p><p><a href="{{link_url::entwicklung}}">Mehr erfahren</a></p>', addImage: true, singleSRC: 'file:icons/entwicklung.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Beratung' }, text: '<p>Strategie, Konzeption und Content-Planung.</p><p><a href="{{link_url::beratung}}">Mehr erfahren</a></p>', addImage: true, singleSRC: 'file:icons/beratung.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Performance' }, text: '<p>Schnelle Ladezeiten und Top-Werte bei Core Web Vitals.</p>', addImage: true, singleSRC: 'file:icons/performance.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'SEO' }, text: '<p>Technische Optimierung und Inhalte, die gefunden werden.</p>', addImage: true, singleSRC: 'file:icons/seo.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Support' }, text: '<p>Updates, Wartung und schnelle Hilfe im Alltag.</p>', addImage: true, singleSRC: 'file:icons/support.svg' }
