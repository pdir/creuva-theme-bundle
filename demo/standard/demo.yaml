              - { type: 'text', headline: 'Gestaltung mit System', text: '<p>Farben, Typografie und Komponenten bilden ein Designsystem, das mit Ihrem Unternehmen wächst.</p><ul><li>Responsive Layouts für alle Bildschirmgrößen</li><li>Barrierearme Gestaltung nach WCAG</li><li>Prototypen zum Durchklicken</li></ul>', addImage: true, singleSRC: 'file:bilder/detail-3.jpg', size: ['800', '600', 'crop'], floating: 'right' }
      - title: Entwicklung
        alias: entwicklung
        articles:
          - title: Entwicklung
            elements:
              - { type: 'creuva_hero', creuvaKicker: 'Leistungen', headline: { unit: 'h1', value: 'Entwicklung mit' }, creuvaHeadlineAccent: 'Contao.', text: '<p>Saubere, performante und sichere Umsetzungen – von der Unternehmenswebsite bis zur individuellen Erweiterung.</p>', creuvaHeroMask: 'none', creuvaUrl1: '{{link_url::kontakt}}', creuvaLinkTitle1: 'Projekt anfragen' }
              - { type: 'text', headline: 'Technik, die einfach funktioniert', text: '<p>Wir setzen auf Contao, Twig und moderne Standards. Ihre Website bleibt updatefähig und schnell.</p><ul><li>Contao 5 und Contao 6</li><li>Individuelle Erweiterungen und Schnittstellen</li><li>Performance- und Sicherheitsoptimierung</li></ul>', addImage: true, singleSRC: 'file:bilder/detail-2.jpg', size: ['800', '600', 'crop'], floating: 'left' }
      - title: Beratung
        alias: beratung
        articles:
          - title: Beratung
