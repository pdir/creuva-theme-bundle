            data:
              - { key: '01 Analyse', value: 'Wir lernen Ihr Unternehmen und Ihre Ziele kennen.' }
              - { key: '02 Konzept', value: 'Struktur, Inhalte und Funktionen werden geplant.' }
              - { key: '03 Design', value: 'Entwürfe für alle wichtigen Seiten und Geräte.' }
              - { key: '04 Umsetzung', value: 'Entwicklung mit Contao und Creuva.' }
