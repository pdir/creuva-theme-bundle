              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Entwicklung' }, text: '<p>Saubere, performante Umsetzungen mit Contao und modernen Technologien.</p><p><a href="{{link_url::entwicklung}}">Mehr erfahren</a></p>', addImage: true, singleSRC: 'file:icons/entwicklung.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Beratung' }, text: '<p>Strategische Beratung für nachhaltige und erfolgreiche digitale Projekte.</p><p><a href="{{link_url::beratung}}">Mehr erfahren</a></p>', addImage: true, singleSRC: 'file:icons/beratung.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Support' }, text: '<p>Persönliche Betreuung – auch lange nach dem Launch.</p><p><a href="{{link_url::kontakt}}">Mehr erfahren</a></p>', addImage: true, singleSRC: 'file:icons/support.svg' }
      - title: Agentur
