              - { type: 'creuva_hero', creuvaKicker: 'Leistungen', headline: { unit: 'h1', value: 'Beratung mit' }, creuvaHeadlineAccent: 'Weitblick.', text: '<p>Wir helfen Ihnen, die richtigen Entscheidungen für Ihren digitalen Auftritt zu treffen.</p>', creuvaHeroMask: 'none', creuvaUrl1: '{{link_url::kontakt}}', creuvaLinkTitle1: 'Termin vereinbaren' }
