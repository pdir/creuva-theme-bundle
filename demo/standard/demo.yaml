          - type: accordion
            children:
              - { type: text, sectionHeadline: { unit: h3, value: 'Kann ich direkt von Contao 4.13 auf Contao 6 wechseln?' }, text: '<p>Technisch führt der Weg über Contao 5.7, die Datenbank wird dabei in Etappen migriert. Bei sehr alten Installationen ist ein Relaunch mit Übernahme der Inhalte oft schneller und sauberer.</p>' }
