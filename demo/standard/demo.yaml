            headline: Gemeinsam zum Ziel
            subline: So arbeiten wir
            text: <p>Wir arbeiten in klaren Schritten und binden Sie in jede Entscheidung ein. So entstehen Websites, die zu Ihrem Unternehmen passen.</p><ul><li>Workshop und Zieldefinition</li><li>Konzept, Wireframes und Design</li><li>Umsetzung in Contao</li><li>Schulung, Launch und Betreuung</li></ul>
            addImage: true
            singleSRC: file:bilder/detail-1.jpg
            size: ['800', '600', 'crop']
            floating: right
      - title: Ablauf
