                  - { key: '01 Beratung', value: 'Wir besprechen Ihre Ziele und Anforderungen.' }
                  - { key: '02 Konzeption', value: 'Wir entwickeln ein individuelles Konzept.' }
                  - { key: '03 Umsetzung', value: 'Design und Entwicklung gehen Hand in Hand.' }
                  - { key: '04 Launch', value: 'Ihre neue Website geht online – und wir bleiben an Ihrer Seite.' }
