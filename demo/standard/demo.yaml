                        cssID: u-accordion-icon
                        children:
                          - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Was macht Creuva genau?' }, text: '<p>Creuva entwickelt moderne Websites, Webanwendungen und digitale Lösungen auf Basis von Contao – von der ersten Idee über Konzeption und Design bis zur technischen Umsetzung und Betreuung.</p>' }
                          - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Für welche Unternehmen ist Creuva geeignet?' }, text: '<p>Für Unternehmen, Vereine und öffentliche Einrichtungen jeder Größe.</p>' }
                          - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Wie läuft ein typisches Projekt ab?' }, text: '<p>Von der ersten Idee über Konzeption und Design bis zum Launch begleiten wir Sie Schritt für Schritt.</p>' }
                          - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Welche Vorteile bietet Contao?' }, text: '<p>Contao ist sicher, schnell, barrierearm und lässt sich von Redakteuren einfach bedienen.</p>' }
                          - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Wie lange dauert die Umsetzung?' }, text: '<p>Je nach Umfang zwischen vier und zwölf Wochen.</p>' }
