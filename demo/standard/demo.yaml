            headline: Häufige Fragen zu unseren Leistungen
            children:
              - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Wie lange dauert ein Website-Projekt?' }, text: '<p>Je nach Umfang zwischen vier und zwölf Wochen. Einen genauen Zeitplan erhalten Sie mit unserem Angebot.</p>' }
              - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Kann ich die Website selbst pflegen?' }, text: '<p>Ja. Contao ist intuitiv bedienbar und wir schulen Ihr Team persönlich.</p>' }
              - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Übernehmt ihr auch Hosting und Wartung?' }, text: '<p>Gerne – mit unseren Wartungspaketen bleibt Ihre Website sicher und aktuell.</p>' }
    children:
      - title: Webdesign
