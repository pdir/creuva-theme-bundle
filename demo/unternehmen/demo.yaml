forms:
  anfrage:
    title: Anfrage
    alias: anfrage
    jumpTo: 'page:danke'
    fields:
      - { type: text, name: company, label: Unternehmen, autocomplete: organization }
      - { type: text, name: name, mandatory: true, label: 'Ansprechpartner', autocomplete: name }
      - { type: text, name: email, mandatory: true, label: E-Mail-Adresse, rgxp: email, autocomplete: email }
      - { type: text, name: phone, label: Telefon, rgxp: phone, autocomplete: tel }
      - type: select
        name: topic
        label: Anliegen
        options:
          - { value: anfrage, label: 'Angebotsanfrage' }
          - { value: konstruktion, label: Konstruktion }
          - { value: fertigung, label: 'Fertigung und Lohnarbeit' }
          - { value: montage, label: 'Montage und Service' }
          - { value: sonstiges, label: Sonstiges }
      - { type: textarea, name: message, mandatory: true, label: 'Ihr Projekt (Material, Stückzahl, Termin)', size: ['6', '40'] }
      - { type: upload, name: drawing, label: 'Zeichnung oder Stückliste (PDF, DXF, STEP, max. 10 MB)', extensions: 'pdf,dxf,step,stp,zip', maxlength: 10485760 }
      - type: checkbox
        name: privacy
        mandatory: true
        options: [{ value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }]
      - { type: submit, slabel: 'Anfrage senden' }
  bewerbung:
    title: Bewerbung
    alias: bewerbung
    jumpTo: 'page:danke'
    fields:
      - type: select
        name: position
        mandatory: true
        label: 'Stelle'
        options:
          - { value: zerspanung, label: 'Zerspanungsmechaniker (m/w/d)' }
          - { value: konstruktion, label: 'Konstrukteur Stahlbau (m/w/d)' }
          - { value: schweissen, label: 'Schweißer MAG/WIG (m/w/d)' }
          - { value: ausbildung, label: 'Ausbildung Metallbauer (m/w/d)' }
          - { value: initiativ, label: Initiativbewerbung }
      - { type: text, name: name, mandatory: true, label: 'Vor- und Nachname', autocomplete: name }
      - { type: text, name: email, mandatory: true, label: E-Mail-Adresse, rgxp: email, autocomplete: email }
      - { type: text, name: phone, label: Telefon, rgxp: phone, autocomplete: tel }
      - { type: text, name: start, label: 'Frühester Eintrittstermin' }
      - { type: textarea, name: message, label: 'Ein paar Sätze zu Ihnen', size: ['5', '40'] }
      - { type: upload, name: documents, mandatory: true, label: 'Lebenslauf und Zeugnisse (PDF, max. 10 MB)', extensions: pdf, maxlength: 10485760 }
      - type: checkbox
        name: privacy
        mandatory: true
        options: [{ value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }]
      - { type: submit, slabel: 'Bewerbung senden' }
news:
  karriere:
    title: Stellenangebote
    jumpTo: 'page:stelle'
    items:
      - alias: zerspanungsmechaniker
        headline: 'Zerspanungsmechaniker (m/w/d)'
        subheadline: 'Vollzeit · Neuburg · ab sofort'
        teaser: '<p>Sie richten unsere CNC-Bearbeitungszentren ein, fertigen Einzelteile und Serien und prüfen die Qualität – in moderner Halle und im Zweischichtbetrieb.</p>'
        date: '-3 days'
        elements:
          - type: text
            headline: { unit: h2, value: 'Ihre Aufgaben' }
            text: '<ul><li>Einrichten und Bedienen von CNC-Fräs- und Drehmaschinen</li><li>Fertigung nach Zeichnung, Einzelteile und Kleinserien</li><li>Prüfen der Maße und Dokumentation</li><li>Mitarbeit bei der Optimierung von Programmen</li></ul>'
          - type: text
            headline: { unit: h2, value: 'Ihr Profil' }
            text: '<ul><li>Abgeschlossene Ausbildung als Zerspanungsmechaniker oder vergleichbar</li><li>Erfahrung mit Heidenhain- oder Siemens-Steuerungen</li><li>Sorgfalt und Freude an Präzision</li></ul>'
          - type: text
            headline: { unit: h2, value: 'Wir bieten' }
            text: '<ul><li>Unbefristeter Vertrag und tarifnahe Bezahlung</li><li>30 Tage Urlaub, Weihnachts- und Urlaubsgeld</li><li>Jobrad, betriebliche Altersvorsorge, Weiterbildung</li></ul><p><a href="{{link_url::bewerbung}}">Jetzt bewerben</a></p>'
            cssID: u-button
      - alias: konstrukteur-stahlbau
        headline: 'Konstrukteur Stahlbau (m/w/d)'
        subheadline: 'Vollzeit · Neuburg · Hybrid möglich'
        teaser: '<p>Sie planen Stahlkonstruktionen und Baugruppen in 3D, erstellen Werkstattzeichnungen und stimmen sich mit Kunden und Fertigung ab.</p>'
        date: '-8 days'
        elements:
          - type: text
            headline: { unit: h2, value: 'Ihre Aufgaben' }
            text: '<ul><li>Konstruktion in Tekla Structures und Inventor</li><li>Erstellen von Werkstatt- und Montagezeichnungen</li><li>Abstimmung mit Statikern, Kunden und Fertigung</li></ul>'
          - type: text
            headline: { unit: h2, value: 'Ihr Profil' }
            text: '<ul><li>Technikerin, Techniker oder Studium im Bereich Stahlbau</li><li>Sicherer Umgang mit 3D-CAD</li><li>Kenntnisse der EN 1090 sind von Vorteil</li></ul><p><a href="{{link_url::bewerbung}}">Jetzt bewerben</a></p>'
            cssID: u-button
      - alias: schweisser
        headline: 'Schweißer MAG/WIG (m/w/d)'
        subheadline: 'Vollzeit · Neuburg · ab sofort'
        teaser: '<p>Sie schweißen Baugruppen und Stahlkonstruktionen nach Zeichnung – mit gültiger Prüfung nach ISO 9606 oder der Bereitschaft, sie bei uns zu machen.</p>'
        date: '-15 days'
        elements:
          - type: text
            text: '<p>Wir suchen Verstärkung für unsere Schweißerei mit zwölf Arbeitsplätzen und einem Schweißroboter. Sie arbeiten im Team mit erfahrenen Kolleginnen und Kollegen und werden von unserer Schweißaufsicht begleitet.</p><p><a href="{{link_url::bewerbung}}">Jetzt bewerben</a></p>'
            cssID: u-button
      - alias: ausbildung-metallbauer
        headline: 'Ausbildung Metallbauer (m/w/d)'
        subheadline: 'Ausbildung · Neuburg · Start 1. September'
        teaser: '<p>Dreieinhalb Jahre Ausbildung in Fertigung, Schweißerei und Montage – mit eigener Ausbildungswerkstatt und hoher Übernahmequote.</p>'
        date: '-20 days'
        elements:
          - type: text
            text: '<p>Bei uns lernen Sie alles, was eine gute Fachkraft braucht: vom Lesen technischer Zeichnungen über Schweißen und Montage bis zur Arbeit an modernen CNC-Maschinen. In den letzten fünf Jahren haben wir alle Auszubildenden übernommen.</p><p><a href="{{link_url::bewerbung}}">Jetzt bewerben</a></p>'
            cssID: u-button
  aktuelles:
    title: Aktuelles
    jumpTo: 'page:meldung'
    items:
      - alias: neuer-faserlaser
        headline: 'Neuer 12-kW-Faserlaser in Betrieb'
        subheadline: 'Doppelte Schneidgeschwindigkeit bei Blechen bis 25 mm'
        teaser: '<p>Mit dem neuen Faserlaser schneiden wir Baustahl bis 25 mm und Edelstahl bis 20 mm – schneller, präziser und mit weniger Energie.</p>'
        singleSRC: 'file:bilder/fertigung.jpg'
        date: '-4 days'
        elements:
          - type: text
            text: '<p>Seit diesem Monat läuft in Halle 2 ein 12-kW-Faserlaser mit automatischem Plattenwechsler. Damit verdoppeln wir die Schneidleistung bei dicken Blechen und können auch nachts mannarm fertigen.</p><p>Für unsere Kunden heißt das: kürzere Lieferzeiten und gleichbleibende Qualität, auch bei großen Stückzahlen.</p>'
          - { type: download, overwriteLink: true, singleSRC: 'file:downloads/datenblatt-laserschneiden.pdf', linkTitle: 'Datenblatt Laserschneiden' }
      - alias: zertifizierung-en-1090-exc-3
        headline: 'Zertifizierung nach EN 1090 EXC 3 bestätigt'
        subheadline: 'Höchste Ausführungsklasse für tragende Stahlbauteile'
        teaser: '<p>Das Überwachungsaudit hat unsere Zertifizierung nach EN 1090 in der Ausführungsklasse EXC 3 ohne Abweichungen bestätigt.</p>'
        singleSRC: 'file:bilder/schweissen.jpg'
        date: '-18 days'
        elements:
          - type: text
            text: '<p>Damit dürfen wir weiterhin tragende Stahlbauteile für Brücken, Hallen und Industrieanlagen mit hohen Anforderungen fertigen. Ein Dank an das gesamte Team – vor allem an unsere Schweißaufsicht.</p>'
      - alias: tag-der-ausbildung
        headline: 'Tag der Ausbildung: 60 Schülerinnen und Schüler zu Gast'
        subheadline: 'Ausprobieren, schweißen, fragen'
        teaser: '<p>Am Tag der Ausbildung konnten Jugendliche aus der Region in unserer Lehrwerkstatt selbst Hand anlegen.</p>'
        singleSRC: 'file:bilder/ausbildung.jpg'
        date: '-30 days'
        elements:
          - type: text
            text: '<p>Unsere Auszubildenden haben gezeigt, was sie können, und die Gäste beim Feilen, Biegen und Schweißen am Simulator begleitet. Für das kommende Ausbildungsjahr sind noch Plätze frei.</p><p><a href="{{link_url::karriere}}">Zu den Stellenangeboten</a></p>'
modules:
  breadcrumb: { type: breadcrumb, name: Breadcrumb }
  aktuelles-neueste: { type: newslist, name: 'Aktuelles – Neueste', imgSize: 'image_size:news', numberOfItems: 3, news_archives: ['news_archive:aktuelles'], cssID: u-news-no-author }
  aktuelles-liste:
    type: newslist
    cssID: u-news-no-author
    name: 'Aktuelles – Liste'
