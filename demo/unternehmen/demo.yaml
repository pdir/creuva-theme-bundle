# Creuva – Unternehmen demo
#
# Imported with: vendor/bin/contao-console creuva:install --demo=unternehmen
# A classic company website for medium-sized businesses, industry, service
# providers and craft businesses: services, industry solutions, references,
# company, careers with job offers, downloads and contact. More serious and
# structured than the standard demo.
# See src/Installer/DemoImporter.php for the value syntax (file:, page:, date:, …).
#
# The images, logos and certificates are generated illustrations, replace them
# with real photos and documents of the same proportions.

