    numberOfItems: 0
    news_archives: ['news_archive:aktuelles']
  aktuelles-leser:
    type: newsreader
    cssID: u-news-no-author
    name: 'Aktuelles – Leser'
    imgSize: 'image_size:news-detail'
    overviewPage: 'page:aktuelles'
    news_archives: ['news_archive:aktuelles']
  stellen:
    type: newslist
    cssID: u-news-no-author
    name: 'Karriere – Stellenangebote'
    numberOfItems: 0
    news_template: news_creuva_job
    news_archives: ['news_archive:karriere']
  stellen-neueste:
    type: newslist
    cssID: u-news-no-author
    name: 'Karriere – Neueste Stellen'
    numberOfItems: 3
    news_template: news_creuva_job
    news_archives: ['news_archive:karriere']
  stelle-leser:
    type: newsreader
    cssID: u-news-no-author
    name: 'Karriere – Stellenanzeige'
    overviewPage: 'page:karriere'
    news_archives: ['news_archive:karriere']
  sitemap: { type: sitemap, name: Sitemap }
  suche: { type: search, name: Suche, searchType: simple, perPage: 10, contextLength: ['48', '280'], minKeywordLength: 3 }
pages:
  - type: regular
    title: Start
    alias: index
    hide: true
    description: 'Kessler Metalltechnik: Konstruktion, Laserschneiden, Schweißen und Montage von Metallbauteilen und Stahlkonstruktionen für Maschinenbau, Bau und Energie.'
    articles:
      - title: Hero
        elements:
          - type: creuva_hero
            size: 'image_size:cover'
            headline: { unit: h1, value: 'Metalltechnik, auf die' }
            text: '<p>Wir konstruieren, fertigen und montieren Bauteile, Baugruppen und Stahlkonstruktionen – zuverlässig, termintreu und nach EN 1090 und ISO 9001.</p>'
            singleSRC: 'file:bilder/start.jpg'
            creuvaKicker: 'Kessler Metalltechnik GmbH'
            creuvaHeadlineAccent: 'Sie bauen können.'
            creuvaBadge: 'Fertigung Halle 1, Neuburg'
            creuvaHeroMask: cover
            creuvaUrl1: '{{link_url::kontakt|urlattr}}'
            creuvaLinkTitle1: 'Anfrage stellen'
            creuvaUrl2: '{{link_url::leistungen|urlattr}}'
            creuvaLinkTitle2: 'Unsere Leistungen'
      - title: Kennzahlen
        teaserCssID: ['', '']
        cssID: u-py-0
        elements:
          - type: description_list
            headline: { unit: h2, value: 'Kessler in Zahlen' }
            customTpl: content_element/description_list/creuva_stats
            data:
              - { key: '1987', value: Gegründet }
              - { key: '120', value: Mitarbeitende }
              - { key: '9.500 m²', value: Fertigungsfläche }
              - { key: '98 %', value: 'Liefertreue' }
            cssID: 'u-bg-primary u-full-bleed u-text-center u-no-countup'
      - title: Leistungen
        teaserCssID: ['', '']
        elements:
          - type: element_group
            cssID: 'u-grid-2 u-align-end'
            children:
              - { type: headline, headline: 'Alles aus einer Hand.', subline: Leistungen }
              - type: text
                text: '<p>Von der ersten Skizze bis zur Montage auf der Baustelle: Wir begleiten Ihr Projekt mit eigener Konstruktion, moderner Fertigung und erfahrenen Montageteams.</p><p><a href="{{link_url::leistungen}}">Alle Leistungen</a></p>'
                cssID: u-muted
          - type: element_group
            cssID: u-grid-4
            children:
              - type: text
                addImage: true
                headline: { unit: h3, value: Konstruktion }
                text: '<p>3D-Konstruktion, Werkstattzeichnungen und Statik-Abstimmung.</p><p><a href="{{link_url::konstruktion}}">Mehr erfahren</a></p>'
                singleSRC: 'file:icons/konstruktion.svg'
                customTpl: content_element/text/creuva_feature
                cssID: u-icon-soft
              - type: text
                addImage: true
                headline: { unit: h3, value: 'Laser & Kanten' }
                text: '<p>Faserlaser bis 25 mm, Abkanten bis 4 m Länge.</p><p><a href="{{link_url::fertigung}}">Mehr erfahren</a></p>'
                singleSRC: 'file:icons/laser.svg'
                customTpl: content_element/text/creuva_feature
                cssID: u-icon-soft
              - type: text
                addImage: true
                headline: { unit: h3, value: Schweißen }
                text: '<p>MAG, WIG und Roboterschweißen nach ISO 3834.</p><p><a href="{{link_url::fertigung}}">Mehr erfahren</a></p>'
                singleSRC: 'file:icons/schweissen.svg'
                customTpl: content_element/text/creuva_feature
                cssID: u-icon-soft
              - type: text
                addImage: true
                headline: { unit: h3, value: 'Montage & Service' }
                text: '<p>Eigene Montageteams, Wartung und Ersatzteile.</p><p><a href="{{link_url::montage-service}}">Mehr erfahren</a></p>'
                singleSRC: 'file:icons/montage.svg'
                customTpl: content_element/text/creuva_feature
                cssID: u-icon-soft
      - title: Branchen
        teaserCssID: ['', '']
        cssID: u-bg-muted
        elements:
          - type: element_group
            cssID: 'u-grid-2 u-align-end'
            children:
              - { type: headline, headline: 'Lösungen für Ihre Branche.', subline: Branchen }
              - type: text
                text: '<p>Wir kennen die Anforderungen unserer Kunden – von der Toleranz im Maschinenbau bis zur Hygiene in der Lebensmittelindustrie.</p><p><a href="{{link_url::branchen}}">Alle Branchen</a></p>'
                cssID: u-muted
          - type: element_group
            cssID: u-grid-4
            children:
              - type: text
                addImage: true
                size: 'image_size:card'
                headline: { unit: h3, value: Maschinenbau }
                text: '<p>Gestelle, Verkleidungen und Baugruppen.</p><p><a href="{{link_url::maschinenbau}}">Zur Branche</a></p>'
                singleSRC: 'file:bilder/halle.jpg'
                customTpl: content_element/text/creuva_card
