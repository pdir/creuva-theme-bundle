      - title: 'TuS Kirchberg – TSV Rotenbach'
        alias: tus-kirchberg-tsv
        date: next saturday +7 days
        startTime: '15:00'
        endTime: '16:45'
        location: 'Sportplatz Kirchberg'
        teaser: '<p>Kreisliga A, 14. Spieltag. Gemeinsame Anreise mit dem Fanbus ab 13:30 Uhr am Vereinsheim.</p>'
      - title: 'Vereinsfest am Sportpark'
        alias: vereinsfest
        date: next saturday +21 days
        startTime: '10:00'
        endTime: '23:00'
        location: 'Sportpark am Mühlbach'
        teaser: '<p>Jugendturnier, Alte Herren gegen Sponsoren-Auswahl und Livemusik am Abend.</p>'
      - title: 'Jahreshauptversammlung'
        alias: jahreshauptversammlung
        date: +32 days
        startTime: '19:30'
        endTime: '22:00'
        location: 'Vereinsheim'
        teaser: '<p>Mit Berichten des Vorstands, Wahlen und Ehrungen langjähriger Mitglieder.</p>'
      - title: 'FC Bergheim – TSV Rotenbach 1:3'
        alias: fc-bergheim-tsv
        date: -2 days
        startTime: '15:00'
        endTime: '16:45'
        location: 'Waldstadion Bergheim'
        teaser: '<p>Endstand 1:3 (0:2). Tore: Rossi (2), Hartmann.</p>'
      - title: 'TSV Rotenbach Damen – SpVgg Oberfeld 2:2'
        alias: tsv-damen-spvgg-oberfeld
        date: -3 days
        startTime: '11:00'
        endTime: '12:45'
        location: 'Sportpark am Mühlbach'
        teaser: '<p>Endstand 2:2 (1:1). Ausgleich in der Nachspielzeit.</p>'
      - title: 'TSV Rotenbach – VfB Talhausen 4:0'
        alias: tsv-vfb-talhausen
        date: -9 days
        startTime: '15:00'
        endTime: '16:45'
        location: 'Sportpark am Mühlbach'
        teaser: '<p>Endstand 4:0 (2:0). Souveräner Heimsieg vor 420 Zuschauern.</p>'
      - title: 'A-Jugend: SC Lindenau – TSV Rotenbach 2:1'
        alias: a-jugend-sc-lindenau
        date: -10 days
        startTime: '10:30'
        endTime: '12:15'
        location: 'Sportanlage Lindenau'
        teaser: '<p>Endstand 2:1 (1:1). Knappe Niederlage nach starker erster Halbzeit.</p>'
modules:
  breadcrumb: { type: breadcrumb, name: Breadcrumb }
  news-neueste: { type: newslist, name: 'News – Neueste', imgSize: 'image_size:news', numberOfItems: 3, news_archives: ['news_archive:news'], cssID: u-news-no-author }
  news-liste:
    type: newslist
    cssID: u-news-no-author
    name: 'News – Liste'
    imgSize: 'image_size:news'
    perPage: 6
    numberOfItems: 0
    news_archives: ['news_archive:news']
  news-leser:
    type: newsreader
    cssID: u-news-no-author
    name: 'News – Leser'
    imgSize: 'image_size:news-detail'
    overviewPage: 'page:news'
    news_archives: ['news_archive:news']
  spiele-naechste: { type: eventlist, name: 'Spielplan – Nächste Spiele', cal_calendar: ['calendar:spielplan'], cal_format: next_365, cal_order: ascending, cal_noSpan: true, numberOfItems: 6 }
  spiele-ergebnisse: { type: eventlist, name: 'Spielplan – Ergebnisse', cal_calendar: ['calendar:spielplan'], cal_format: past_365, cal_order: descending, cal_noSpan: true, numberOfItems: 6 }
  spiel-leser: { type: eventreader, name: 'Spielplan – Spiel', cal_calendar: ['calendar:spielplan'], overviewPage: 'page:spielplan' }
  sitemap: { type: sitemap, name: Sitemap }
  suche: { type: search, name: Suche, searchType: simple, perPage: 10, contextLength: ['48', '280'], minKeywordLength: 3 }
pages:
  - type: regular
    title: Start
    alias: index
    description: 'TSV Rotenbach 1921: Fußball für alle Generationen – Mannschaften, Spielplan, Ergebnisse, News und Mitgliedschaft.'
    articles:
      - title: Hero
        elements:
          - type: creuva_hero
            size: 'image_size:cover'
            headline: { unit: h1, value: 'Leidenschaft seit' }
            text: '<p>Fußball für alle Generationen: 14 Mannschaften, über 480 Mitglieder und ein Sportpark, in dem jeden Tag der Ball rollt.</p>'
            singleSRC: 'file:bilder/start.jpg'
            creuvaKicker: 'TSV Rotenbach 1921 e. V.'
            creuvaHeadlineAccent: '1921.'
            creuvaBadge: 'Sportpark am Mühlbach'
            creuvaHeroMask: cover
            creuvaUrl1: '{{link_url::mitglied-werden|urlattr}}'
            creuvaLinkTitle1: 'Mitglied werden'
            creuvaUrl2: '{{link_url::spielplan|urlattr}}'
            creuvaLinkTitle2: 'Zum Spielplan'
      - title: Spieltag
        elements:
          - type: element_group
            cssID: 'u-grid-2 u-align-end'
            children:
              - { type: headline, headline: Spieltag., subline: 'Die 1. Herren am', headline_inline: '1' }
              - type: text
                text: '<p>Spitzenspiel am Samstag: Erster gegen Zweiter. Kommt vorbei und unterstützt die Mannschaft!</p><p><a href="{{link_url::spielplan}}">Alle Spiele und Ergebnisse</a></p>'
                cssID: u-muted
          - type: element_group
            cssID: u-grid-2
            children:
              - type: creuva_match
                headline: { unit: h2, value: 'Nächstes Spiel' }
                creuvaKicker: 'Kreisliga A · 13. Spieltag'
                creuvaHomeTeam: 'TSV Rotenbach'
                creuvaHomeLogo: 'file:wappen/tsv-rotenbach.svg'
                creuvaAwayTeam: 'SV Grünwald'
                creuvaAwayLogo: 'file:wappen/sv-gruenwald.svg'
                creuvaMatchDate: 'date:next saturday 15:00'
                creuvaVenue: 'Sportpark am Mühlbach'
                creuvaUrl1: '{{link_url::spielplan}}'
                creuvaLinkTitle1: 'Zum Spielplan'
              - type: creuva_match
                headline: { unit: h2, value: 'Letztes Ergebnis' }
                creuvaKicker: 'Kreisliga A · 12. Spieltag'
                creuvaHomeTeam: 'FC Bergheim'
                creuvaHomeLogo: 'file:wappen/fc-bergheim.svg'
                creuvaAwayTeam: 'TSV Rotenbach'
                creuvaAwayLogo: 'file:wappen/tsv-rotenbach.svg'
                creuvaMatchDate: 'date:-2 days 15:00'
                creuvaVenue: 'Waldstadion Bergheim'
                creuvaScore: '1:3'
                creuvaUrl1: '{{news_url::auswaertssieg-in-bergheim}}'
                creuvaLinkTitle1: Spielbericht
      - title: News
        teaserCssID: ['', '']
        cssID: u-bg-surface
        elements:
          - type: element_group
            cssID: 'u-grid-2 u-align-end'
            children:
              - { type: headline, headline: Verein., subline: 'Neues aus dem', headline_inline: '1' }
              - type: text
                text: '<p>Spielberichte, Termine und alles, was im Verein passiert.</p><p><a href="{{link_url::news}}">Alle News</a></p>'
                cssID: u-muted
          - { type: module, module: 'module:news-neueste' }
      - title: Mannschaften
        teaserCssID: ['', '']
        elements:
          - type: element_group
            cssID: 'u-grid-2 u-align-end'
            children:
