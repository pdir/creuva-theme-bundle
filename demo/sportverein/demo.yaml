# Creuva – Sportverein demo
#
# Imported with: vendor/bin/contao-console creuva:install --demo=sportverein
# A demo for football clubs, other sports clubs and smaller associations: teams,
# fixtures, results, league table, news, sponsors, club history, contacts and
# membership. Fixtures and results are events with dates relative to the day of
# the import, so the next matches are always in the future.
# See src/Installer/DemoImporter.php for the value syntax (file:, page:, date:, …).
#
# The images, crests and sponsor logos are generated illustrations, replace
# them with real photos and logos of the same proportions.

title: Sportverein
root:
