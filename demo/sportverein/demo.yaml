forms:
  mitgliedsantrag:
    title: Mitgliedsantrag
    alias: mitgliedsantrag
    jumpTo: 'page:danke'
    fields:
      - { type: text, name: name, mandatory: true, label: 'Vor- und Nachname', autocomplete: name }
      - { type: text, name: birthday, mandatory: true, label: Geburtsdatum, rgxp: date, placeholder: TT.MM.JJJJ, autocomplete: bday }
      - { type: text, name: email, mandatory: true, label: E-Mail-Adresse, rgxp: email, placeholder: name@beispiel.de, autocomplete: email }
      - { type: text, name: phone, label: Telefon, rgxp: phone, autocomplete: tel }
      - type: select
        name: department
        mandatory: true
        label: Abteilung
        options:
          - { value: herren, label: 'Herren' }
          - { value: damen, label: 'Damen' }
          - { value: jugend, label: 'Jugend (bis 18 Jahre)' }
          - { value: alte-herren, label: 'Alte Herren' }
          - { value: foerder, label: Fördermitglied }
      - type: radio
        name: membership
        mandatory: true
        label: Beitrag
        options:
          - { value: kinder, label: 'Kinder und Jugendliche – 60 € im Jahr' }
          - { value: erwachsene, label: 'Erwachsene – 120 € im Jahr' }
          - { value: familie, label: 'Familie – 180 € im Jahr' }
          - { value: foerder, label: 'Fördermitglied – 40 € im Jahr' }
      - { type: textarea, name: message, label: 'Nachricht (z. B. Wunschmannschaft oder Fragen)', size: ['4', '40'] }
      - type: checkbox
        name: privacy
        mandatory: true
        options: [{ value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }]
      - { type: submit, slabel: 'Antrag senden' }
  kontakt:
    title: Kontaktformular
    alias: kontakt
    jumpTo: 'page:danke'
    fields:
      - { type: text, name: name, mandatory: true, label: 'Ihr Name', autocomplete: name }
      - { type: text, name: email, mandatory: true, label: E-Mail-Adresse, rgxp: email, autocomplete: email }
      - type: select
        name: topic
        label: 'Worum geht es?'
        options:
          - { value: training, label: Probetraining }
          - { value: sponsoring, label: Sponsoring }
          - { value: presse, label: Presse }
          - { value: sonstiges, label: Sonstiges }
      - { type: textarea, name: message, mandatory: true, label: 'Ihre Nachricht', size: ['5', '40'] }
      - type: checkbox
        name: privacy
        mandatory: true
        options: [{ value: '1', label: 'Ich habe die <a href="{{link_url::datenschutz}}">Datenschutzerklärung</a> gelesen und stimme zu.' }]
      - { type: submit, slabel: 'Nachricht senden' }
news:
  news:
    title: Vereinsnews
    jumpTo: 'page:bericht'
    items:
      - alias: auswaertssieg-in-bergheim
        headline: 'Auswärtssieg in Bergheim: Drei Punkte und Tabellenspitze'
        subheadline: 'Kreisliga A, 12. Spieltag: FC Bergheim – TSV Rotenbach 1:3'
        teaser: '<p>Mit einem verdienten 3:1 beim FC Bergheim verteidigt unsere Erste die Tabellenführung. Zweimal traf Kapitän Marco Rossi, den Schlusspunkt setzte Neuzugang Emil Hartmann.</p>'
        singleSRC: 'file:bilder/tor.jpg'
        creuvaHeadlineAccent: 'Tabellenspitze'
        date: '-2 days'
        elements:
          - type: creuva_match
            creuvaKicker: 'Kreisliga A · 12. Spieltag'
            creuvaHomeTeam: 'FC Bergheim'
            creuvaHomeLogo: 'file:wappen/fc-bergheim.svg'
            creuvaAwayTeam: 'TSV Rotenbach'
            creuvaAwayLogo: 'file:wappen/tsv-rotenbach.svg'
            creuvaMatchDate: 'date:-2 days 15:00'
            creuvaVenue: 'Waldstadion Bergheim'
            creuvaScore: '1:3'
          - type: text
            text: '<p>Von Beginn an übernahm der TSV die Kontrolle. Nach einer Viertelstunde verwandelte Marco Rossi einen Freistoß aus 20 Metern zur Führung, kurz vor der Pause erhöhte er nach schöner Vorarbeit von Jonas Bauer auf 2:0.</p><p>Nach dem Anschlusstreffer der Gastgeber wurde es noch einmal spannend, doch in der 84. Minute machte Emil Hartmann mit seinem ersten Saisontor alles klar. Am Samstag kommt es nun zum Spitzenspiel gegen den SV Grünwald.</p><blockquote><p>„Die Mannschaft hat heute gezeigt, dass sie auch auswärts Druck aushält. Jetzt freuen wir uns auf ein volles Haus gegen Grünwald.“</p></blockquote><p class="u-muted">Trainer Jonas Bauer</p>'
      - alias: vereinsfest-2026
        headline: 'Vereinsfest am Sportpark: Ein Tag für die ganze Familie'
        subheadline: 'Mit Jugendturnier, Torwandschießen und Livemusik'
        teaser: '<p>Am Vereinsfest spielen unsere Jugendteams ein großes Turnier, abends gibt es Musik vom Vereinsheim. Helferinnen und Helfer sind herzlich willkommen.</p>'
        singleSRC: 'file:bilder/sportpark.jpg'
        creuvaHeadlineAccent: 'ganze Familie'
        date: '-6 days'
        elements:
          - type: text
            text: '<p>Einmal im Jahr feiert der ganze Verein: Ab 10 Uhr spielen unsere Bambini, E- und D-Jugend ein Turnier mit Gästen aus der Region, am Nachmittag treten die Alten Herren gegen eine Auswahl der Sponsoren an. Für Kinder gibt es Torwandschießen, Hüpfburg und Kinderschminken.</p><ul><li>10:00 Uhr Jugendturnier</li><li>15:00 Uhr Alte Herren gegen Sponsoren-Auswahl</li><li>19:00 Uhr Livemusik am Vereinsheim</li></ul>'
          - { type: image, size: 'image_size:wide', singleSRC: 'file:bilder/training-jugend.jpg' }
      - alias: neue-flutlichtanlage
        headline: 'Neue Flutlichtanlage: Heller, sparsamer, leiser'
        subheadline: 'LED-Technik spart rund 60 Prozent Strom'
        teaser: '<p>Dank vieler Spenden und der Förderung durch die Stadtwerke Rotenbach leuchtet unser Hauptplatz jetzt mit moderner LED-Technik.</p>'
        singleSRC: 'file:bilder/flutlicht.jpg'
        creuvaHeadlineAccent: 'Heller'
        date: '-14 days'
        elements:
          - type: text
            text: '<p>Über ein Jahr haben wir geplant, Angebote verglichen und Spenden gesammelt. Jetzt ist es geschafft: Die neue Flutlichtanlage am Hauptplatz verbraucht rund 60 Prozent weniger Strom, leuchtet den Platz gleichmäßiger aus und stört die Nachbarschaft weniger.</p><p>Ein großes Dankeschön an alle Spenderinnen und Spender und an die Stadtwerke Rotenbach, die das Projekt als Hauptförderer möglich gemacht haben.</p>'
      - alias: neue-trainer-jugend
        headline: 'Verstärkung für die Jugend: Drei neue Trainerinnen und Trainer'
        subheadline: 'Unsere Jugendabteilung wächst weiter'
        teaser: '<p>Mehr als 200 Kinder und Jugendliche spielen inzwischen beim TSV. Drei neue Trainerinnen und Trainer helfen, allen ein gutes Training zu bieten.</p>'
        singleSRC: 'file:bilder/mannschaft-jugend.jpg'
        creuvaHeadlineAccent: 'Jugend'
        date: '-21 days'
        elements:
          - type: text
            text: '<p>Lea Hofmann übernimmt die E-Jugend, Tim Krämer und Ayşe Demir kümmern sich um die Bambini. Alle drei haben ihre Trainerlizenz beim Landesverband erworben und werden von Jugendleiterin Selin Kaya begleitet.</p><p>Wer selbst Lust hat, Kinder im Fußball zu begleiten, meldet sich gerne bei uns – wir unterstützen bei der Ausbildung.</p>'
events:
  spielplan:
