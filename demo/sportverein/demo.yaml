    jumpTo: 'page:spiel'
    items:
      - title: 'TSV Rotenbach – SV Grünwald'
        alias: tsv-sv-gruenwald
        date: next saturday
        startTime: '15:00'
        endTime: '16:45'
        location: 'Sportpark am Mühlbach'
        teaser: '<p>Kreisliga A, 13. Spieltag: Spitzenspiel Erster gegen Zweiter. Eintritt 5 €, Kinder frei.</p>'
      - title: 'TSV Rotenbach Damen – SC Lindenau'
        alias: tsv-damen-sc-lindenau
        date: next sunday
        startTime: '11:00'
        endTime: '12:45'
        location: 'Sportpark am Mühlbach'
        teaser: '<p>Bezirksliga Frauen, 9. Spieltag.</p>'
      - title: 'A-Jugend: TSV Rotenbach – FC Bergheim'
        alias: a-jugend-fc-bergheim
