                children:
                  - { type: 'headline', headline: { unit: 'h3', value: 'Event-Liste' } }
                  - { type: 'module', module: 'module:eventlist' }
              - type: element_group
                children:
                  - { type: 'headline', headline: { unit: 'h3', value: 'Minikalender' } }
                  - { type: 'module', module: 'module:minicalendar' }
          - { type: 'headline', headline: { unit: 'h3', value: 'Monatskalender' } }
          - { type: 'module', module: 'module:calendar' }

      - title: Code
        cssID: ['sg-code', '']
        elements:
          - { type: 'headline', headline: 'Code', subline: 'Code-Element' }
          - type: code
            highlight: twig
            code: |
              {% extends '@Contao/content_element/text.html.twig' %}

              {# Eigene Templatevariante mit Dachzeile #}
              {% block inner %}
                  <p class="c-kicker">{{ data.creuvaKicker }}</p>
                  {{ parent() }}
              {% endblock %}
      - title: Module
        cssID: ['sg-module', '']
        elements:
          - { type: 'headline', headline: 'Frontend-Module', subline: 'Module' }
          - { type: 'headline', headline: { unit: 'h3', value: 'Breadcrumb' } }
          - { type: 'module', module: 'module:breadcrumb' }
          - { type: 'headline', headline: { unit: 'h3', value: 'News-Liste' } }
          - { type: 'module', module: 'module:newslist' }
          - { type: 'headline', headline: { unit: 'h3', value: 'Stellenangebote (Listenvorlage news_creuva_job)' } }
          - { type: 'module', module: 'module:jobs' }
          - { type: 'headline', headline: { unit: 'h3', value: 'Nach oben (Toplink-Element)' } }
          - { type: 'toplink', linkTitle: 'Nach oben' }

    children:
      - title: Beitrag
        alias: styleguide-beitrag
        hide: true
        requireItem: true
        searchIndexer: never_index
        sitemap: map_never
        robots: noindex,nofollow
        articles:
          - title: Beitrag
            elements:
              - { type: 'module', module: 'module:breadcrumb' }
              - { type: 'module', module: 'module:newsreader' }
      - title: Termin
        alias: styleguide-termin
        hide: true
        requireItem: true
        searchIndexer: never_index
        sitemap: map_never
        robots: noindex,nofollow
        articles:
          - title: Termin
            elements:
              - { type: 'module', module: 'module:breadcrumb' }
              - { type: 'module', module: 'module:eventreader' }
