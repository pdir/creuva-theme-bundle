      - title: Akkordeon
        cssID: ['sg-akkordeon', 'u-bg-muted']
        elements:
          - { type: 'headline', headline: 'Akkordeon', subline: 'Interaktive Elemente' }
          - type: element_group
            cssID: u-grid-2
            children:
              - type: accordion
                children:
                  - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Erster Akkordeon-Eintrag' }, text: '<p>Standarddarstellung mit Plus-Zeichen.</p>' }
                  - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Zweiter Akkordeon-Eintrag' }, text: '<p>Inhalt des zweiten Eintrags.</p>' }
                  - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Dritter Akkordeon-Eintrag' }, text: '<p>Inhalt des dritten Eintrags.</p>' }
              - type: accordion
                cssID: u-accordion-icon
                children:
                  - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Mit Fragezeichen-Icon' }, text: '<p>Akkordeon-Icon „Fragezeichen“ (u-accordion-icon).</p>' }
                  - { type: 'text', sectionHeadline: { unit: 'h3', value: 'Ideal für FAQ' }, text: '<p>Weitere Icons: „Info“ und „Sprechblase“.</p>' }

      - title: Theme Components
        cssID: ['sg-components', '']
        elements:
          - { type: 'headline', headline: 'Theme Components Bundle', subline: 'Erweiterungen' }
