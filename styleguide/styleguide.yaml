                  - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Performance' }, text: '<p>Schnell auf jedem Gerät.</p>', addImage: true, singleSRC: 'file:icons/performance.svg' }
                  - { type: 'text', customTpl: 'content_element/text/creuva_feature', headline: { unit: 'h3', value: 'Support' }, text: '<p>Auch nach dem Launch.</p>', addImage: true, singleSRC: 'file:icons/support.svg' }
