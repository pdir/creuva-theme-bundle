            cssID: u-grid-4
            children:
              - { type: 'text', headline: { unit: 'h3', value: 'Weiß' }, text: '<p>u-bg-surface</p>', cssID: 'u-bg-surface' }
              - { type: 'text', headline: { unit: 'h3', value: 'Hellgrau' }, text: '<p>u-bg-muted</p>', cssID: 'u-bg-muted u-card' }
              - { type: 'text', headline: { unit: 'h3', value: 'Akzent hell' }, text: '<p>u-bg-accent</p>', cssID: 'u-bg-accent' }
              - { type: 'text', headline: { unit: 'h3', value: 'Primär' }, text: '<p>u-bg-primary</p>', cssID: 'u-bg-primary' }
          - type: element_group
            cssID: u-grid-2
            children:
              - { type: 'text', headline: { unit: 'h3', value: 'Karte' }, text: '<p>Rahmen und Schatten (u-card).</p>', cssID: 'u-card' }
              - { type: 'text', headline: { unit: 'h3', value: 'Zentriert' }, text: '<p>Text zentriert (u-text-center).</p>', cssID: 'u-card u-text-center' }
          - { type: 'text', headline: { unit: 'h3', value: 'Volle Breite' }, text: '<p>Der Hintergrund reicht bis an den Fensterrand, der Inhalt bleibt im Raster (u-full-bleed).</p>', cssID: 'u-bg-accent u-full-bleed u-text-center' }
          - { type: 'text', headline: { unit: 'h3', value: 'Schmal (Lesebreite)' }, text: '<p>Lange Texte lesen sich mit begrenzter Zeilenlänge angenehmer. Die Klasse u-narrow begrenzt die Breite eines Elements auf die Lesebreite.</p>', cssID: 'u-narrow' }

      - title: Animationen
        cssID: ['sg-animation', '']
        elements:
