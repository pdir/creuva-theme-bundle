# Creuva – Styleguide
#
# All elements, template variants, CSS classes and modules of the theme on one
# page, independent of the demo. Added to an existing website with:
#
#   vendor/bin/contao-console creuva:styleguide
#
# The page "Styleguide" (alias "styleguide") is hidden from the navigation and
# search engines. Same value syntax as the demos (src/Installer/DemoImporter.php);
# files are copied to files/creuva-demo/styleguide, the modules, the form and the
# news archive get the prefix "Styleguide – ".

title: Styleguide

files:
  wappen/tsv-rotenbach.svg: { alt: 'Wappen TSV Rotenbach' }
  wappen/sv-gruenwald.svg: { alt: 'Wappen SV Grünwald' }
  logos/buerger-architekten.svg: { alt: 'Bürger Architekten', link: 'https://example.org/' }
  logos/kunsthalle-am-fluss.svg: { alt: 'Kunsthalle am Fluss', link: 'https://example.org/' }
  logos/form-und-ton.svg: { alt: 'Form & Ton', link: 'https://example.org/' }
  logos/duenenblick.svg: { alt: 'Dünenblick' }
  logos/lindenhof.svg: { alt: 'Lindenhof' }
  bilder/hero.jpg: { alt: Illustration einer Website auf Laptop und Smartphone }
  bilder/detail-1.jpg: { alt: Drei Smartphone-Ansichten einer Website, caption: Bild mit Bildunterschrift }
  bilder/detail-2.jpg: { alt: Website-Entwurf im Browserfenster }
  bilder/detail-3.jpg: { alt: Farbpalette und Typografie eines Designsystems }
  bilder/projekt-gruenwerk.jpg: { alt: Website von Grünwerk Energie }
  bilder/projekt-alpenhof.jpg: { alt: Website von Hotel Alpenhof }
  bilder/projekt-nordlicht.jpg: { alt: Website von Nordlicht Studio }
  bilder/team-1.jpg: { alt: Porträt Tobias Krüger }
  bilder/team-2.jpg: { alt: Porträt Mira Schulz }
  downloads/projekt-checkliste.pdf: { title: Checkliste für Ihr Website-Projekt }

# Image sizes of the theme; existing ones with the same name are reused
imageSizes:
  hero: { name: 'Hero', width: 720, height: 480, resizeMode: 'crop', densities: '1x, 2x' }
  cover: { name: 'Vollbild (16:9)', width: 2000, height: 1125, resizeMode: 'crop', items: [{ media: '(max-width: 47.99rem)', width: 800, height: 1100, resizeMode: 'crop', densities: '1.5x' }] }
  card: { name: 'Karte (4:3)', width: 800, height: 600, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  wide: { name: 'Breit (16:9)', width: 1200, height: 675, resizeMode: 'crop', lazyLoading: true }
  team: { name: 'Team (1:1)', width: 480, height: 480, resizeMode: 'crop', densities: '1.5x', lazyLoading: true }
  avatar: { name: 'Avatar', width: 120, height: 120, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  news: { name: 'News-Teaser (16:10)', width: 800, height: 500, resizeMode: 'crop', densities: '2x', lazyLoading: true }
  gallery: { name: 'Galerie (responsiv)', width: 1600, resizeMode: 'proportional', densities: '480w, 800w, 1200w, 1600w', sizes: '(min-width: 64rem) 50vw, 100vw', lazyLoading: true }

forms:
  styleguide:
    title: Styleguide – Formular
    method: POST
    fields:
      - { type: 'text', name: 'name', label: 'Textfeld', mandatory: true, placeholder: 'Ihr Name' }
      - { type: 'text', name: 'email', label: 'E-Mail', rgxp: 'email', placeholder: 'name@beispiel.de' }
      - type: select
        name: topic
        label: Auswahlfeld
        options:
          - { value: '', label: 'Bitte auswählen …' }
          - { value: 'a', label: 'Option A' }
          - { value: 'b', label: 'Option B' }
      - { type: 'textarea', name: 'message', label: 'Textarea', placeholder: 'Ihre Nachricht …', size: ['4', '40'] }
      - type: radio
        name: contact
        label: Radio-Buttons
        options:
          - { value: 'mail', label: 'Per E-Mail', default: '1' }
          - { value: 'phone', label: 'Per Telefon' }
      - type: checkbox
        name: options
        label: Checkboxen
        options:
          - { value: 'privacy', label: 'Ich habe die Datenschutzerklärung gelesen.' }
          - { value: 'newsletter', label: 'Ich möchte den Newsletter erhalten.' }
      - { type: 'range', name: 'budget', label: 'Schieberegler', minval: '0', maxval: '100', step: '5', value: '75' }
      - { type: 'submit', slabel: 'Absenden (ohne Funktion)' }

news:
  styleguide:
    title: Styleguide – News
    jumpTo: page:styleguide-beitrag
    items:
      - headline: Die perfekte Startseite – sieben Elemente, die überzeugen
        alias: styleguide-perfekte-startseite
        date: -2 days
        teaser: <p>Ein Beispielbeitrag für das News-Modul des Styleguides.</p>
        singleSRC: file:bilder/news-1.jpg
        elements:
          - { type: 'text', text: '<p>Inhalt eines Beispielbeitrags mit <strong>Auszeichnung</strong> und einer Liste.</p><ul><li>Klare Botschaft</li><li>Starke Call-to-Actions</li></ul>' }
      - headline: Nachhaltige Websites – warum sie wichtiger sind
        alias: styleguide-nachhaltige-websites
        date: -9 days
        teaser: <p>Noch ein Beispielbeitrag, um die Darstellung der Liste zu zeigen.</p>
        singleSRC: file:bilder/news-2.jpg
      - headline: Ein Blick hinter die Kulissen
        alias: styleguide-hinter-den-kulissen
        date: -16 days
        teaser: <p>Der dritte Beitrag füllt die Reihe.</p>
        singleSRC: file:bilder/news-3.jpg

  styleguide-jobs:
    title: Styleguide – Stellen
    jumpTo: page:styleguide-beitrag
    items:
      - headline: Konstrukteur Stahlbau (m/w/d)
        alias: styleguide-stelle-konstrukteur
        subheadline: Vollzeit · Neuburg · Hybrid möglich
        date: -2 days
        teaser: <p>Stellenanzeige mit der Listenvorlage news_creuva_job. Die Subline wird zu Schlagworten (getrennt durch „·“).</p>
      - headline: Ausbildung Metallbauer (m/w/d)
        alias: styleguide-stelle-ausbildung
        subheadline: Ausbildung · Start 1. September
        date: -6 days
        teaser: <p>Die ganze Karte verlinkt auf die Stellenanzeige.</p>

events:
  styleguide:
    title: Styleguide – Termine
    jumpTo: page:styleguide-termin
    items:
      - title: 'Workshop: Websites barrierefrei gestalten'
        alias: styleguide-workshop-barrierefreiheit
        date: +2 days
        startTime: '10:00'
        endTime: '12:30'
        location: Creuva Studio
        address: Musterstraße 1, 01067 Dresden
        teaser: '<p>Praxisnah durch die WCAG 2.1: Kontraste, Tastaturbedienung und Formulare.</p>'
      - title: 'Webinar: Contao 6 im Überblick'
        alias: styleguide-webinar-contao-6
        date: +6 days
        startTime: '16:00'
        endTime: '17:00'
        location: Online
        teaser: <p>Was sich mit Contao 6 ändert und wie Sie den Umstieg planen.</p>
      - title: Contao-Stammtisch Dresden
        alias: styleguide-stammtisch
        date: +15 days
        startTime: '19:00'
        location: Café am Elbufer
        teaser: <p>Austausch unter Agenturen, Freelancern und Redakteuren.</p>
      - title: Digitalmesse Mitteldeutschland
        alias: styleguide-digitalmesse
        date: +28 days
        endDate: +1 day
        location: Messe Leipzig, Stand B12
        teaser: '<p>Zwei Tage, viele Gespräche: Besuchen Sie uns an unserem Stand.</p>'
modules:
  newslist: { name: 'Styleguide – News-Liste', type: 'newslist', news_archives: ['news_archive:styleguide'], numberOfItems: 3, imgSize: 'image_size:news' }
  newsreader: { name: 'Styleguide – News-Leser', type: 'newsreader', news_archives: ['news_archive:styleguide', 'news_archive:styleguide-jobs'], overviewPage: 'page:styleguide' }
  jobs: { name: 'Styleguide – Stellenangebote', type: 'newslist', news_archives: ['news_archive:styleguide-jobs'], numberOfItems: 0, news_template: 'news_creuva_job' }
  breadcrumb: { name: 'Styleguide – Breadcrumb', type: 'breadcrumb' }
  eventlist: { name: 'Styleguide – Event-Liste', type: 'eventlist', cal_calendar: ['calendar:styleguide'], cal_format: 'next_365', cal_order: 'ascending', cal_noSpan: true }
  eventreader: { name: 'Styleguide – Event-Leser', type: 'eventreader', cal_calendar: ['calendar:styleguide'], overviewPage: 'page:styleguide' }
  calendar: { name: 'Styleguide – Kalender', type: 'calendar', cal_calendar: ['calendar:styleguide'], cal_startDay: 1 }
  minicalendar: { name: 'Styleguide – Minikalender', type: 'calendar', cal_calendar: ['calendar:styleguide'], cal_startDay: 1, cal_ctemplate: 'cal_mini' }

pages:
  - title: Styleguide
    description: 'Alle Elemente, Templatevarianten, CSS-Klassen und Module des Creuva-Themes auf einer Seite.'
    alias: styleguide
    hide: true
    searchIndexer: never_index
    sitemap: map_never
    robots: noindex,nofollow
    articles:
      - title: Intro
        elements:
          - type: creuva_hero
            creuvaKicker: Elemente & Module
            headline: { unit: 'h1', value: 'Flexibel. Klar.' }
            creuvaHeadlineAccent: Wiederverwendbar.
            text: <p>Alle Elemente, Templatevarianten, CSS-Klassen und Module des Creuva-Themes auf einer Seite – als Live-Beispiele. Die Klassen wählen Redakteure im Style Manager (Bereich „Stil“) aus.</p>
            singleSRC: file:bilder/hero.jpg
            size: 'image_size:hero'
            creuvaHeroMask: rounded
            creuvaBadge: "Alle Elemente\nLive-Beispiele"
            creuvaUrl1: '#sg-typografie'
            creuvaLinkTitle1: Zu den Elementen
            creuvaUrl2: '#sg-varianten'
            creuvaLinkTitle2: Templatevarianten
          - type: element_group
            cssID: u-grid-3
            children:
              - { type: 'headline', headline: 'Highlights', cssID: 'u-visually-hidden' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', cssID: 'u-feature-inline', headline: { unit: 'h3', value: 'Modular aufgebaut' }, text: '<p>Alle Elemente sind frei kombinierbar.</p>', addImage: true, singleSRC: 'file:icons/ebenen.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', cssID: 'u-feature-inline', headline: { unit: 'h3', value: 'Für Contao gemacht' }, text: '<p>Standardelemente, Twig und Style Manager.</p>', addImage: true, singleSRC: 'file:icons/zahnrad.svg' }
              - { type: 'text', customTpl: 'content_element/text/creuva_feature', cssID: 'u-feature-inline', headline: { unit: 'h3', value: 'Einheitliches Design' }, text: '<p>Farben, Abstände und Formen aus einem System.</p>', addImage: true, singleSRC: 'file:icons/stern.svg' }
          - type: text
            cssID: u-button-secondary
            text: '<p><a href="#sg-typografie">Typografie</a> <a href="#sg-buttons">Buttons</a> <a href="#sg-listen">Listen & Tabellen</a> <a href="#sg-medien">Medien</a> <a href="#sg-slider">Slider</a> <a href="#sg-termine">Termine</a> <a href="#sg-varianten">Templatevarianten</a> <a href="#sg-farben">Farben</a> <a href="#sg-kennzahlen">Kennzahlen & Timeline</a> <a href="#sg-akkordeon">Akkordeon</a> <a href="#sg-components">Theme Components</a> <a href="#sg-klassen">Klassen</a> <a href="#sg-animation">Animationen</a> <a href="#sg-formular">Formular</a> <a href="#sg-module">Module</a></p>'

      - title: Farben & Typografie
        cssID: ['sg-typografie', 'u-bg-muted']
        elements:
          - type: element_group
            cssID: u-grid-2 u-align-end
            children:
              - { type: 'headline', headline: 'Farben & Typografie', subline: 'Grundlagen' }
              - { type: 'text', cssID: 'u-lead', text: '<p>Farben, Schriften und Abstände kommen aus dem Farbschema des Seitenlayouts – alle Elemente passen sich automatisch an.</p>' }
          - type: html
            html: |
              <div class="u-grid-4" style="--grid-min:9rem">
                <div class="u-card"><div style="height:4rem;border-radius:var(--radius-m);background:var(--c-primary)"></div><p><strong>Primär</strong><br><code>--c-primary</code></p></div>
                <div class="u-card"><div style="height:4rem;border-radius:var(--radius-m);background:var(--c-accent)"></div><p><strong>Akzent</strong><br><code>--c-accent</code></p></div>
                <div class="u-card"><div style="height:4rem;border-radius:var(--radius-m);background:var(--c-accent-soft)"></div><p><strong>Akzent hell</strong><br><code>--c-accent-soft</code></p></div>
                <div class="u-card"><div style="height:4rem;border-radius:var(--radius-m);background:var(--c-surface-muted);border:1px solid var(--c-border)"></div><p><strong>Fläche</strong><br><code>--c-surface-muted</code></p></div>
              </div>
          - type: element_group
            cssID: u-grid-2
            children:
              - type: element_group
                cssID: u-card
                children:
                  - { type: 'headline', headline: { unit: 'h1', value: 'H1 – Hauptüberschrift' } }
                  - { type: 'headline', headline: { unit: 'h2', value: 'H2 – Abschnittstitel' } }
                  - { type: 'headline', headline: { unit: 'h3', value: 'H3 – Unterüberschrift' } }
                  - { type: 'headline', headline: { unit: 'h4', value: 'H4 – Weitere Überschrift' } }
                  - { type: 'headline', headline: { unit: 'h5', value: 'H5 – Kleinere Überschrift' } }
                  - { type: 'headline', headline: { unit: 'h6', value: 'H6 – Feine Überschrift' } }
              - type: element_group
                children:
                  - type: text
                    cssID: u-card
                    headline: { unit: 'h3', value: 'Fließtext' }
                    text: '<p class="u-lead">Einleitung mit der Klasse u-lead.</p><p>Moderner, gut lesbarer Fließtext mit <strong>fetter</strong> und <em>kursiver</em> Auszeichnung, <mark>Markierung</mark>, <code>Inline-Code</code> und einem <a href="#sg-typografie">Link im Text</a>.</p>'
                  - type: element_group
                    cssID: u-card
                    children:
                      - { type: 'text', headline: { unit: 'h3', value: 'Zitat & Textstile' }, text: '<blockquote><p>„Eine aussagekräftige Zitatform für wichtige Aussagen oder Kundenstimmen.“</p></blockquote>' }
                      - { type: 'text', cssID: 'u-kicker', text: '<p>Dachzeile (u-kicker)</p>' }
                      - { type: 'text', cssID: 'u-muted', text: '<p>Gedämpfter Text (u-muted)</p>' }
                      - { type: 'text', cssID: 'u-accent', text: '<p>Text in Akzentfarbe (u-accent)</p>' }
          - type: element_group
            cssID: u-grid-2
            children:
              - { type: 'headline', headline: 'Überschrift mit Dachzeile', subline: 'Dachzeile' }
              - { type: 'headline', headline: 'Akzent.', subline: 'Zweifarbige Überschrift mit', headline_inline: '1' }
              - { type: 'text', creuvaKicker: 'Feld „Dachzeile“', headline: { unit: 'h3', value: 'Text-Element mit Dachzeile' }, text: '<p>Die Dachzeile steht über der Überschrift und ist für Text- und Beschreibungslisten-Elemente verfügbar.</p>' }
              - { type: 'text', customTpl: 'content_element/text/simplebox', headline: { unit: 'h3', value: 'Hinweisbox' }, text: '<p>Dies ist ein hervorgehobener Hinweistext (Templatevariante „simplebox“ aus dem Theme Components Bundle).</p>' }

      - title: Buttons & Links
        cssID: ['sg-buttons', '']
        elements:
          - { type: 'headline', headline: 'Buttons & Links', subline: 'Interaktion' }
          - type: element_group
            cssID: u-grid-3
            children:
              - type: element_group
                cssID: u-card
                children:
                  - { type: 'headline', headline: { unit: 'h3', value: 'Hyperlink-Element' } }
                  - { type: 'hyperlink', url: '#sg-buttons', linkTitle: 'Primär-Button', cssID: 'u-button' }
                  - { type: 'hyperlink', url: '#sg-buttons', linkTitle: 'Sekundär-Button', cssID: 'u-button-secondary' }
                  - { type: 'hyperlink', url: '#sg-buttons', linkTitle: 'Akzent-Button', cssID: 'u-button-accent' }
                  - { type: 'hyperlink', url: '#sg-buttons', linkTitle: 'Outline (Hauptfarbe)', cssID: 'u-button-outline' }
                  - { type: 'hyperlink', url: '#sg-buttons', linkTitle: 'Outline (Akzentfarbe)', cssID: 'u-button-outline-accent' }
                  - { type: 'hyperlink', url: '#sg-buttons', linkTitle: 'Textlink mit Pfeil' }
              - type: text
                cssID: u-card u-button
                headline: { unit: 'h3', value: 'Text-Element mit Buttons' }
                text: '<p>Mit der Auswahl „Primär-Button“ im Style Manager werden die Links im letzten Absatz zu Buttons.</p><p><a href="#sg-buttons">Erster Link</a> <a href="#sg-buttons">Zweiter Link</a></p>'
              - type: text
                cssID: u-bg-primary
                headline: { unit: 'h3', value: 'Auf dunkler Fläche' }
                text: '<p>In Flächen mit u-bg-primary werden Buttons hell.</p><p><a href="#sg-buttons">Button auf Primär</a></p>'

      - title: Listen & Tabellen
        cssID: ['sg-listen', 'u-bg-muted']
        elements:
          - { type: 'headline', headline: 'Listen & Tabellen', subline: 'Struktur' }
          - type: element_group
            cssID: u-grid-3
            children:
              - { type: 'list', cssID: 'u-card', headline: { unit: 'h3', value: 'Ungeordnete Liste' }, listtype: 'unordered', listitems: ['Erster Listenpunkt', 'Zweiter Listenpunkt', 'Dritter Listenpunkt', 'Weiterer Listenpunkt'] }
              - { type: 'list', cssID: 'u-card', headline: { unit: 'h3', value: 'Geordnete Liste' }, listtype: 'ordered', listitems: ['Erster Schritt', 'Zweiter Schritt', 'Dritter Schritt', 'Weitere Schritte'] }
              - { type: 'description_list', cssID: 'u-card', headline: { unit: 'h3', value: 'Beschreibungsliste' }, data: [{ key: 'Theme', value: 'Creuva' }, { key: 'Contao', value: '5.7 und 6' }, { key: 'Templates', value: 'Twig' }] }
          - type: table
            headline: { unit: 'h3', value: 'Tabelle' }
            thead: true
            tableitems:
              - [Leistung, Paket S, Paket M, Paket L]
              - [Individuelles Design, '✓', '✓', '✓']
              - [Seitenanzahl, bis 5, bis 15, unbegrenzt]
              - [Support, 3 Monate, 6 Monate, 12 Monate]
          - type: table
            headline: { unit: 'h3', value: 'Paket-Vergleich (u-table-compare)' }
            cssID: u-table-compare
            thead: true
            tableitems:
              - [Leistung, Starter, Business, Premium]
              - [Seitenanzahl, bis zu 5, bis zu 15, unbegrenzt]
              - [Responsive Design, '✓', '✓', '✓']
              - [Mehrsprachigkeit, '–', optional, '✓']
              - [Support nach Launch, '–', 3 Monate, 6 Monate]

      - title: Bilder, Medien & Dateien
        cssID: ['sg-medien', '']
        elements:
          - type: table
            headline: { unit: 'h3', value: 'Liga-Tabelle (u-table-league)' }
            cssID: u-table-league
            thead: true
            tableitems:
              - [Pl., Mannschaft, Sp., Tore, Pkt.]
              - ['1', '<strong>TSV Rotenbach</strong>', '12', '31:12', '29']
              - ['2', 'SV Grünwald', '12', '27:11', '27']
              - ['3', 'FC Bergheim', '12', '25:16', '23']
              - ['4', 'SpVgg Oberfeld', '12', '22:17', '21']
          - { type: 'headline', headline: 'Bilder, Medien & Dateien', subline: 'Medien' }
          - type: element_group
            cssID: u-grid-2
            children:
              - { type: 'image', singleSRC: 'file:bilder/detail-1.jpg', size: 'image_size:card' }
              - type: element_group
                children:
                  - { type: 'download', headline: { unit: 'h3', value: 'Download-Element' }, singleSRC: 'file:downloads/projekt-checkliste.pdf', overwriteLink: true, linkTitle: 'Projekt-Checkliste (PDF)' }
                  - { type: 'downloads', headline: { unit: 'h3', value: 'Downloads-Element' }, multiSRC: ['file:downloads/projekt-checkliste.pdf'] }
          - { type: 'gallery', headline: { unit: 'h3', value: 'Galerie (4 Bilder pro Reihe)' }, multiSRC: ['file:bilder/projekt-gruenwerk.jpg', 'file:bilder/projekt-alpenhof.jpg', 'file:bilder/projekt-nordlicht.jpg', 'file:bilder/detail-3.jpg'], size: 'image_size:card', fullsize: true, perRow: 4 }
          - { type: 'gallery', headline: { unit: 'h3', value: 'Mosaik, großes Bild links (u-gallery-mosaic)' }, cssID: 'u-gallery-mosaic', multiSRC: ['file:bilder/projekt-gruenwerk.jpg', 'file:bilder/projekt-alpenhof.jpg', 'file:bilder/projekt-nordlicht.jpg', 'file:bilder/detail-3.jpg'], size: 'image_size:gallery', fullsize: true, perRow: 4 }
          - { type: 'gallery', headline: { unit: 'h3', value: 'Mosaik, großes Bild rechts (u-gallery-mosaic-right)' }, cssID: 'u-gallery-mosaic-right', multiSRC: ['file:bilder/detail-1.jpg', 'file:bilder/detail-2.jpg', 'file:bilder/detail-3.jpg', 'file:bilder/projekt-alpenhof.jpg'], size: 'image_size:gallery', fullsize: true, perRow: 4 }
          - { type: 'gallery', headline: { unit: 'h3', value: 'Erstes Bild groß (u-gallery-featured)' }, cssID: 'u-gallery-featured', multiSRC: ['file:bilder/hero.jpg', 'file:bilder/detail-1.jpg', 'file:bilder/detail-2.jpg', 'file:bilder/detail-3.jpg'], size: 'image_size:gallery', fullsize: true, perRow: 3 }
          - { type: 'gallery', headline: { unit: 'h3', value: 'Masonry (u-gallery-masonry)' }, cssID: 'u-gallery-masonry', multiSRC: ['file:bilder/hero.jpg', 'file:bilder/team-1.jpg', 'file:bilder/detail-1.jpg', 'file:bilder/projekt-nordlicht.jpg', 'file:bilder/team-2.jpg', 'file:bilder/detail-2.jpg'], size: 'image_size:gallery', fullsize: true, perRow: 3 }
          - { type: 'creuva_logos', headline: { unit: 'h3', value: 'Logoleiste' }, multiSRC: ['file:logos/buerger-architekten.svg', 'file:logos/kunsthalle-am-fluss.svg', 'file:logos/form-und-ton.svg', 'file:logos/duenenblick.svg', 'file:logos/lindenhof.svg'], creuvaLogosHeight: '3rem' }

      - title: Slider
        cssID: ['sg-slider', 'u-bg-muted']
        elements:
          - type: element_group
            cssID: u-grid-2 u-align-end
            children:
              - { type: 'headline', headline: 'Slider', subline: 'Content-Slider' }
              - { type: 'text', cssID: 'u-lead', text: '<p>Jedes Element im Slider ist ein Slide: Bilder, Karten, Texte oder ganze Elementgruppen. Einstellbar sind Elemente pro Ansicht (1–4), Pfeile, Punkte, Thumbnails, Autoplay und Endlosschleife.</p>' }
          - type: element_group
            cssID: u-grid-2
            children:
              - type: swiper
                headline: { unit: 'h3', value: 'Bilder, Pfeile und Punkte' }
                children:
                  - { type: 'image', singleSRC: 'file:bilder/hero.jpg', size: 'image_size:card' }
                  - { type: 'image', singleSRC: 'file:bilder/detail-1.jpg', size: 'image_size:card' }
                  - { type: 'image', singleSRC: 'file:bilder/detail-2.jpg', size: 'image_size:card' }
                  - { type: 'image', singleSRC: 'file:bilder/detail-3.jpg', size: 'image_size:card' }
              - type: swiper
